name: Update Football Data

on:
  # Hourly FALLBACK only. GitHub throttles cron schedules (the old 10-minute
  # cron fired every 4-7 hours in practice), so the real trigger is
  # rog_dispatch.py on the ROG, which calls workflow_dispatch every 20 min
  # while matches are on and every 3 h otherwise (README §2.0).
  schedule:
  - cron: '5 12-23,0-2 * * *'  # 7:05am-9:05pm EST, once an hour
  workflow_dispatch: # rog_dispatch.py and manual runs from the GitHub UI

# All football-data.org bots share one queue so their calls never overlap
concurrency:
  group: football-data-api
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Create output directory
        run: mkdir -p output
      
      - name: Fetch football data
        env:
          API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: |
          # Update the API key in the script temporarily
          sed -i "s/const API_KEY = .*/const API_KEY = '$API_KEY';/" fetch_all_leagues.js
          node fetch_all_leagues.js

      # Runs right after the scores are pulled: adds goal scorers, assists and
      # cards from ESPN (no key, no football-data.org calls)
      - name: Fetch goal scorers and cards
        run: node fetch_match_events.js

      - name: Check if data changed
        id: check_changes
        run: |
          git add output/
          if ! git diff --staged --quiet; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add output/
          git commit -m "🤖 Update football data - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Report status
        run: |
          if [ "${{ steps.check_changes.outputs.changed }}" == "true" ]; then
            echo "✅ Data updated successfully!"
          else
            echo "ℹ️ No changes detected - data is up to date"
          fi
