name: Fetch Match Statistics

on:
  schedule:
    - cron: '6,16,26,36,46,56 12-23,0-2 * * *'  # 7:06am-9:06pm ESTeeeeern Fetch Statistics
    # - cron: '59 4 * * *'  # 11:59 PM ESTe (4:59 AM UTC next day)
  workflow_dispatch:  # Allow manual runs
    inputs:
      fetch_all:
        description: 'Fetch all matches (backfill)'
        required: false
        type: boolean
        default: false

jobs:
  fetch-statistics:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Fetch match statistics
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.fetch_all }}" = "true" ]; then
            echo "Running in BACKFILL mode (all matches)"
            node fetch_match_statistics.js --all
          else
            echo "Running in NORMAL mode (today's matches only)"
            node fetch_match_statistics.js
          fi
      
      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add output/match_statistics.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update match statistics - $(date)" && git push)
