name: Update Highlights Daily

on:
  # Hourly FALLBACK only: rog_dispatch.py on the ROG triggers this every
  # 40 min while there are fresh results (GitHub throttles crons, README §2.0)
  schedule:
  - cron: '35 12-23,0-2 * * *'  # 7:35am-9:35pm EST, once an hour

  # rog_dispatch.py and manual runs
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Backfill all matches (not just last 48 hours)'
        required: false
        type: boolean
        default: false

# One scraper at a time: a fallback cron run and a ROG-triggered run queue up
# instead of racing each other to push
concurrency:
  group: youtube-highlights
  cancel-in-progress: false

jobs:
  update-highlights:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Chrome
        run: |
          # Install Chrome
          # apt-key was removed from newer Ubuntu runners, so use a keyring file instead
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
      
      - name: Install Python dependencies
        run: |
          pip install selenium webdriver-manager
      
      - name: Run YouTube scraper
        run: |
          cd output
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            echo "Running in BACKFILL mode (all matches)"
            python ../youtube_web_scraper.py --backfill
          else
            echo "Running in NORMAL mode (last 48 hours)"
            python ../youtube_web_scraper.py
          fi
      
      - name: Commit and push if changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Check if there are changes
          if [ -f "output/highlights_database_updated.json" ]; then
            mv output/highlights_database_updated.json output/highlights_database.json
            git add output/highlights_database.json
            
            if git diff --staged --quiet; then
              echo "No changes to commit"
            else
              git commit -m "🎥 Auto-update highlights ($(date +'%Y-%m-%d %H:%M'))"
              # Other workflows push to main while the scraper runs; rebase onto them before pushing
              git pull --rebase
              git push
            fi
          else
            echo "No updated database file found"
          fi
