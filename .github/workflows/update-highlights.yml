name: Update Highlights Daily

on:
  # Run every day at 8:15pm EST but for some reason it actually triggers at 8:52pm EST
  schedule:
    - cron: '35 23 * * *'  # 11:35pm UTC = 6:35pm EST
  
  # Also allow manual trigger
  workflow_dispatch:

jobs:
  update-highlights:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Chrome
        run: |
          # Install Chrome
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
      
      - name: Install Python dependencies
        run: |
          pip install selenium webdriver-manager
      
      - name: Run YouTube scraper
        run: |
          cd output
          python ../youtube_web_scraper.py
      
      - name: Commit and push if changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Check if there are changes
          if [ -f "output/highlights_database_updated.json" ]; then
            mv output/highlights_database_updated.json output/highlights_database.json
            git add output/highlights_database.json
            
            if git diff --staged --quiet; then
              echo "No changes to commit"
            else
              git commit -m "🎥 Auto-update highlights ($(date +'%Y-%m-%d %H:%M'))"
              git push
            fi
          else
            echo "No updated database file found"
          fi
