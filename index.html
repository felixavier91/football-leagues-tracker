                                    <div class="stat-home ${homeClass}">${homeStats.fouls}</div>
                                    <div class="stat-label">Fouls</div>
                                    <div class="stat-away ${awayClass}">${awayStats.fouls}</div>
                                </div>
                            `);
                        }
                        
                        // Yellow Cards
                        if (homeStats.yellow_cards !== undefined && awayStats.yellow_cards !== undefined) {
                            const homeClass = homeStats.yellow_cards < awayStats.yellow_cards ? 'stat-highlight' : '';
                            const awayClass = awayStats.yellow_cards < homeStats.yellow_cards ? 'stat-highlight' : '';
                            statsRows.push(`
                                <div class="stat-row">
                                    <div class="stat-home ${homeClass}">${homeStats.yellow_cards}</div>
                                    <div class="stat-label">Yellow Cards</div>
                                    <div class="stat-away ${awayClass}">${awayStats.yellow_cards}</div>
                                </div>
                            `);
                        }
                        
                        // Red Cards (includes straight reds and second yellows)
                        if (homeStats.red_cards !== undefined && awayStats.red_cards !== undefined) {
                            const homeReds = (homeStats.red_cards || 0) + (homeStats.yellow_red_cards || 0);
                            const awayReds = (awayStats.red_cards || 0) + (awayStats.yellow_red_cards || 0);
                            const homeClass = homeReds < awayReds ? 'stat-highlight' : '';
                            const awayClass = awayReds < homeReds ? 'stat-highlight' : '';
                            statsRows.push(`
                                <div class="stat-row">
                                    <div class="stat-home ${homeClass}">${homeReds}</div>
                                    <div class="stat-label">Red Cards</div>
                                    <div class="stat-away ${awayClass}">${awayReds}</div>
                                </div>
                            `);
                        }
                        
                        // Offsides
                        if (homeStats.offsides !== undefined && awayStats.offsides !== undefined) {
                            const homeClass = homeStats.offsides < awayStats.offsides ? 'stat-highlight' : '';
                            const awayClass = awayStats.offsides < homeStats.offsides ? 'stat-highlight' : '';
                            statsRows.push(`
                                <div class="stat-row">
                                    <div class="stat-home ${homeClass}">${homeStats.offsides}</div>
                                    <div class="stat-label">Offsides</div>
                                    <div class="stat-away ${awayClass}">${awayStats.offsides}</div>
                                </div>
                            `);
                        }
                        
                        // Corners
                        if (homeStats.corner_kicks !== undefined && awayStats.corner_kicks !== undefined) {
                            const homeClass = homeStats.corner_kicks > awayStats.corner_kicks ? 'stat-highlight' : '';
                            const awayClass = awayStats.corner_kicks > homeStats.corner_kicks ? 'stat-highlight' : '';
                            statsRows.push(`
                                <div class="stat-row">
                                    <div class="stat-home ${homeClass}">${homeStats.corner_kicks}</div>
                                    <div class="stat-label">Corners</div>
                                    <div class="stat-away ${awayClass}">${awayStats.corner_kicks}</div>
                                </div>
                            `);
                        }
                        
                        if (statsRows.length > 0) {
                            // Team shields above stats
                            const teamShieldsStats = `
                                <div class="team-shields">
                                    <div class="shield-home">
                                        <img src="${match.homeTeam.crest}" alt="${match.homeTeam.shortName}" style="width: 40px; height: 40px;">
                                    </div>
                                    <div class="shield-away">
                                        <img src="${match.awayTeam.crest}" alt="${match.awayTeam.shortName}" style="width: 40px; height: 40px;">
                                    </div>
                                </div>
                            `;
                            
                            matchStatsSection = `
                                <div class="match-stats-container">
                                    ${teamShieldsStats}
                                    <div class="match-stats-grid">
                                        ${statsRows.join('')}
                                    </div>
                                </div>
                            `;
                        }
                    }
                }

                // Starters and Substitutions Section from match_statistics
                let startersSection = '';
                if (match.status === 'FINISHED') {
                    const matchStats = matchStatistics[currentLeagueCode]?.[match.id];
                    
                    if (matchStats && matchStats.homeTeam?.lineup && matchStats.awayTeam?.lineup) {
                        // Helper function to format name as just last name
                        const formatName = (fullName) => {
                            const parts = fullName.trim().split(' ');
                            if (parts.length === 1) return parts[0];
                            const lastName = parts[parts.length - 1];
                            return lastName;
                        };
                        
                        // Helper function to abbreviate position
                        const abbreviatePosition = (position) => {
                            const posMap = {
                                'Goalkeeper': 'GK',
                                'Centre-Back': 'CB',
                                'Left-Back': 'LB',
                                'Right-Back': 'RB',
                                'Defensive Midfield': 'CDM',
                                'Central Midfield': 'CM',
                                'Midfield': 'CM',
                                'Attacking Midfield': 'CAM',
                                'Left Midfield': 'LM',
                                'Right Midfield': 'RM',
                                'Left Winger': 'LW',
                                'Right Winger': 'RW',
                                'Centre-Forward': 'CF',
                                'Forward': 'FW',
                                'Striker': 'ST',
                                'Offence': 'FW'
                            };
                            return posMap[position] || position;
                        };
                        
                        // Build home starters with substitution arrows, sorted by shirt number
                        const homeStartersData = matchStats.homeTeam.lineup
                            .sort((a, b) => (a.shirtNumber || 99) - (b.shirtNumber || 99))
                            .map(player => {
                                const name = formatName(player.name);
                                const shirtNumber = player.shirtNumber || '';
                                
                                // Check if this player was substituted
                                let wasSubbed = false;
                                if (matchStats.substitutions) {
                                    const sub = matchStats.substitutions.find(s => 
                                        s.team.id === matchStats.homeTeam.id && s.playerOut.name === player.name
                                    );
                                    wasSubbed = !!sub;
                                }
                                
                                // Arrow on the right for home team (left column) - wider, taller, more spacing
                                const arrow = wasSubbed ? ' <span style="color: #c8102e; font-weight: bold; transform: scale(2.5, 1.8); display: inline-block; margin-left: 4px;">↓</span>' : '';
                                return `<div class="starter-item">${shirtNumber} ${name}${arrow}</div>`;
                            });
                        
                        // Build away starters with substitution arrows, sorted by shirt number
                        const awayStartersData = matchStats.awayTeam.lineup
                            .sort((a, b) => (a.shirtNumber || 99) - (b.shirtNumber || 99))
                            .map(player => {
                                const name = formatName(player.name);
                                const shirtNumber = player.shirtNumber || '';
                                
                                // Check if this player was substituted
                                let wasSubbed = false;
                                if (matchStats.substitutions) {
                                    const sub = matchStats.substitutions.find(s => 
                                        s.team.id === matchStats.awayTeam.id && s.playerOut.name === player.name
                                    );
                                    wasSubbed = !!sub;
                                }
                                
                                // Arrow on the left for away team (right column) - wider, taller, more spacing
                                const arrow = wasSubbed ? '<span style="color: #c8102e; font-weight: bold; transform: scale(2.5, 1.8); display: inline-block; margin-right: 4px;">↓</span> ' : '';
                                return `<div class="starter-item">${arrow}${name} ${shirtNumber}</div>`;
                            });
                        
                        // Build home bench (entire bench, sorted by shirt number)
                        const homeBenchData = [];
                        if (matchStats.homeTeam.bench) {
                            matchStats.homeTeam.bench
                                .sort((a, b) => (a.shirtNumber || 99) - (b.shirtNumber || 99))
                                .forEach(player => {
                                    const name = formatName(player.name);
                                    const shirtNumber = player.shirtNumber || '';
                                    
                                    // Check if this player came on as a substitute
                                    let cameOn = false;
                                    if (matchStats.substitutions) {
                                        const sub = matchStats.substitutions.find(s => 
                                            s.team.id === matchStats.homeTeam.id && s.playerIn.id === player.id
                                        );
                                        cameOn = !!sub;
                                    }
                                    
                                    // Arrow on the right for home team (left column) - wider, taller, green, more spacing
                                    const arrow = cameOn ? ' <span style="color: #28a745; font-weight: bold; transform: scale(2.5, 1.8); display: inline-block; margin-left: 4px;">↑</span>' : '';
                                    homeBenchData.push(`<div class="starter-item">${shirtNumber} ${name}${arrow}</div>`);
                                });
                        }
                        
                        // Build away bench (entire bench, sorted by shirt number)
                        const awayBenchData = [];
                        if (matchStats.awayTeam.bench) {
                            matchStats.awayTeam.bench
                                .sort((a, b) => (a.shirtNumber || 99) - (b.shirtNumber || 99))
                                .forEach(player => {
                                    const name = formatName(player.name);
                                    const shirtNumber = player.shirtNumber || '';
                                    
                                    // Check if this player came on as a substitute
                                    let cameOn = false;
                                    if (matchStats.substitutions) {
                                        const sub = matchStats.substitutions.find(s => 
                                            s.team.id === matchStats.awayTeam.id && s.playerIn.id === player.id
                                        );
                                        cameOn = !!sub;
                                    }
                                    
                                    // Arrow on the left for away team (right column) - wider, taller, green, more spacing
                                    const arrow = cameOn ? '<span style="color: #28a745; font-weight: bold; transform: scale(2.5, 1.8); display: inline-block; margin-right: 4px;">↑</span> ' : '';
                                    awayBenchData.push(`<div class="starter-item">${arrow}${name} ${shirtNumber}</div>`);
                                });
                        }
                        
                        // Pad starters to same length
                        const homeStarters = [...homeStartersData];
                        const awayStarters = [...awayStartersData];
                        const maxStartersLength = Math.max(homeStarters.length, awayStarters.length);
                        while (homeStarters.length < maxStartersLength) homeStarters.push('<div class="starter-item">&nbsp;</div>');
                        while (awayStarters.length < maxStartersLength) awayStarters.push('<div class="starter-item">&nbsp;</div>');
                        
                        // Build starters rows
                        let startersRows = '';
                        for (let i = 0; i < maxStartersLength; i++) {
                            startersRows += `
                                <div class="starters-row">
                                    <div class="starters-home">${homeStarters[i]}</div>
                                    <div class="starters-away">${awayStarters[i]}</div>
                                </div>
                            `;
                        }
                        
                        // Pad substitutes to same length
                        const homeBench = [...homeBenchData];
                        const awayBench = [...awayBenchData];
                        const maxBenchLength = Math.max(homeBench.length, awayBench.length);
                        while (homeBench.length < maxBenchLength) homeBench.push('<div class="starter-item">&nbsp;</div>');
                        while (awayBench.length < maxBenchLength) awayBench.push('<div class="starter-item">&nbsp;</div>');
                        
                        // Build bench rows
                        let benchRows = '';
                        for (let i = 0; i < maxBenchLength; i++) {
                            benchRows += `
                                <div class="starters-row">
                                    <div class="starters-home">${homeBench[i]}</div>
                                    <div class="starters-away">${awayBench[i]}</div>
                                </div>
                            `;
                        }
                        
                        // Only show bench section if there are any bench players
                        const benchSection = maxBenchLength > 0 ? `
                            <div style="text-align: center; font-weight: normal; color: #666; margin-top: 15px; margin-bottom: 10px;">Bench</div>
                            <div class="starters-container">
                                ${benchRows}
                            </div>
                        ` : '';
                        
                        // Managers section
                        const homeCoachName = matchStats.homeTeam.coach?.name ? formatName(matchStats.homeTeam.coach.name) : 'N/A';
                        const awayCoachName = matchStats.awayTeam.coach?.name ? formatName(matchStats.awayTeam.coach.name) : 'N/A';
                        
                        const managersSection = `
                            <div style="text-align: center; font-weight: normal; color: #666; margin-top: 15px; margin-bottom: 10px;">Managers</div>
                            <div class="starters-row">
                                <div class="starters-home"><div class="starter-item">${homeCoachName}</div></div>
                                <div class="starters-away"><div class="starter-item">${awayCoachName}</div></div>
                            </div>
                        `;
                        
                        // Team shields above starters
                        const teamShields = `
                            <div class="team-shields">
                                <div class="shield-home">
                                    <img src="${match.homeTeam.crest}" alt="${match.homeTeam.shortName}" style="width: 40px; height: 40px;">
                                </div>
                                <div class="shield-away">
                                    <img src="${match.awayTeam.crest}" alt="${match.awayTeam.shortName}" style="width: 40px; height: 40px;">
                                </div>
                            </div>
                        `;
                        
                        startersSection = `
                            <div class="match-stats-container" style="margin-top: 15px;">
                                ${teamShields}
                                <div style="text-align: center; font-weight: normal; color: #666; margin-bottom: 10px;">Starters</div>
                                <div class="starters-container">
                                    ${startersRows}
                                </div>
                                ${benchSection}
                                ${managersSection}
                            </div>
                        `;
                    }
                }

                // League Standings Section (at bottom of card)
                let standingsSection = '';
                if (window.currentLeagueStats && window.currentLeagueStats.standings) {
                    const standings = window.currentLeagueStats.standings;
                    const homeTeamId = match.homeTeam.id;
                    const awayTeamId = match.awayTeam.id;
                    
                    let standingsRows = standings.map(team => {
                        const isHighlighted = (team.team.id === homeTeamId || team.team.id === awayTeamId);
                        const rowClass = isHighlighted ? 'class="standings-highlight"' : '';
                        
                        // Format Last 5 with colors - ALL BOLD
                        const last5HTML = team.last5.split(' ').map(symbol => {
                            if (symbol === '✓') return '<span style="color: #28a745; font-weight: bold;">✓</span>'; // Green
                            if (symbol === '✗') return '<span style="color: #dc3545; font-weight: bold;">✗</span>'; // Red
                            return '<span style="color: #999; font-weight: bold;">−</span>'; // Gray
                        }).join(' ');
                        
                        return `
                            <tr ${rowClass}>
                                <td>${team.position}</td>
                                <td style="text-align: center;"><img src="${team.team.crest}" alt="${team.team.tla}" style="width: 20px; height: 20px; object-fit: contain;"></td>
                                <td style="text-align: left;">${team.team.tla}</td>
                                <td>${team.playedGames}</td>
                                <td>${team.won}</td>
                                <td>${team.draw}</td>
                                <td>${team.lost}</td>
                                <td style="font-weight: bold;">${team.points}</td>
                                <td>${team.goalsFor}</td>
                                <td>${team.goalsAgainst}</td>
                                <td>${team.goalDifference}</td>
                                <td>${last5HTML}</td>
                            </tr>
                        `;
                    }).join('');
                    
                    standingsSection = `
                        <div class="match-stats-container" style="margin-top: 20px;">
                            <div style="overflow-x: auto;">
                                <table class="standings-table">
                                    <thead>
                                        <tr>
                                            <th style="font-weight: normal;">Pos</th>
                                            <th></th>
                                            <th style="text-align: left; font-weight: normal;">Team</th>
                                            <th style="font-weight: normal;">MP</th>
                                            <th style="font-weight: normal;">W</th>
                                            <th style="font-weight: normal;">D</th>
                                            <th style="font-weight: normal;">L</th>
                                            <th style="font-weight: bold;">Pts</th>
                                            <th style="font-weight: normal;">GF</th>
                                            <th style="font-weight: normal;">GA</th>
                                            <th style="font-weight: normal;">GD</th>
                                            <th style="font-weight: normal;">Last 5</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${standingsRows}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `;
                }

                // Create tabs for Stats, Lineups, and Standings
                // Create tabs for Stats, Standings, Lineups, and History
                const matchTabs = `
                    <div class="match-tabs">
                        <button class="match-tab active" onclick="switchMatchTab(this, 'stats-${match.id}', event)">Stats</button>
                        <button class="match-tab" onclick="switchMatchTab(this, 'standings-${match.id}', event)">Standings</button>
                        <button class="match-tab" onclick="switchMatchTab(this, 'lineups-${match.id}', event)">Lineups</button>
                        <button class="match-tab" onclick="switchMatchTab(this, 'history-${match.id}', event)">History</button>
                    </div>
                `;
                
                // Build History section
                let historySection = '';
                const h2h = head2headData[match.id];
                if (h2h && h2h.matches && h2h.matches.length > 0) {
                    // Aggregate stats at top
                    const agg = h2h.aggregates;
                    const homeTeamName = match.homeTeam.tla;
                    const awayTeamName = match.awayTeam.tla;
                    
                    const aggregateHTML = `
                        <div style="background: #f5f5f5; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                            <div style="text-align: center; font-weight: 600; color: #333; margin-bottom: 10px;">Head to Head Record</div>
                            <div style="display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; text-align: center;">
                                <div>
                                    <div style="font-size: 1.5em; font-weight: bold; color: #c8102e;">${agg.homeTeam.wins}</div>
                                    <div style="font-size: 0.85em; color: #666;">${homeTeamName} Wins</div>
                                </div>
                                <div>
                                    <div style="font-size: 1.5em; font-weight: bold; color: #666;">${agg.homeTeam.draws}</div>
                                    <div style="font-size: 0.85em; color: #666;">Draws</div>
                                </div>
                                <div>
                                    <div style="font-size: 1.5em; font-weight: bold; color: #c8102e;">${agg.awayTeam.wins}</div>
                                    <div style="font-size: 0.85em; color: #666;">${awayTeamName} Wins</div>
                                </div>
                            </div>
                            <div style="text-align: center; margin-top: 10px; font-size: 0.85em; color: #666;">
                                ${agg.numberOfMatches} matches played
                            </div>
                        </div>
                    `;
                    
                    // Historical matches in chronological order (newest first)
                    // Keep team positions consistent with current match
                    const currentHomeTeamId = match.homeTeam.id;
                    const currentAwayTeamId = match.awayTeam.id;
                    
                    const historicalMatches = h2h.matches
                        .sort((a, b) => new Date(b.utcDate) - new Date(a.utcDate))
                        .map(histMatch => {
                            const histDate = new Date(histMatch.utcDate).toLocaleDateString(undefined, {
                                year: 'numeric',
                                month: 'short',
                                day: 'numeric'
                            });
                            
                            // Determine if we need to swap teams to match current match order
                            let leftTeam, rightTeam, leftScore, rightScore;
                            
                            if (histMatch.homeTeam.id === currentHomeTeamId) {
                                // Historical home team matches current home team - keep order
                                leftTeam = histMatch.homeTeam;
                                rightTeam = histMatch.awayTeam;
                                leftScore = histMatch.score?.fullTime?.home ?? '-';
                                rightScore = histMatch.score?.fullTime?.away ?? '-';
                            } else {
                                // Historical home team matches current away team - swap order
                                leftTeam = histMatch.awayTeam;
                                rightTeam = histMatch.homeTeam;
                                leftScore = histMatch.score?.fullTime?.away ?? '-';
                                rightScore = histMatch.score?.fullTime?.home ?? '-';
                            }
                            
                            return `<div class="match-oneliner" style="padding: 10px; border-bottom: 1px solid #f0f0f0;"><img src="${leftTeam.crest}" class="team-logo" alt="${leftTeam.tla}" onerror="this.style.display='none'"><span class="team-name">${leftTeam.tla}</span><span class="score">${leftScore} - ${rightScore}</span><span class="team-name">${rightTeam.tla}</span><img src="${rightTeam.crest}" class="team-logo" alt="${rightTeam.tla}" onerror="this.style.display='none'"><span class="date" style="margin-left: auto; font-size: 0.85em;">${histDate}</span></div>`;
                        })
                        .join('');
                    
                    historySection = `
                        <div class="match-stats-container" style="margin-top: 15px;">
                            ${historicalMatches}
                        </div>
                    `;
                } else {
                    historySection = `
                        <div class="match-stats-container" style="margin-top: 15px; text-align: center; color: #666;">
                            No historical data available
                        </div>
                    `;
                }

                // Wrap each section in a tab panel
                const tabPanels = `
                    <div class="match-tab-panel active" id="stats-${match.id}">
                        ${matchStatsSection}
                    </div>
                    <div class="match-tab-panel" id="standings-${match.id}">
                        ${standingsSection}
                    </div>
                    <div class="match-tab-panel" id="lineups-${match.id}">
                        ${startersSection}
                    </div>
                    <div class="match-tab-panel" id="history-${match.id}">
                        ${historySection}
                    </div>
                `;

                // Full expanded details (VIDEO at top, then venue/referee, timeline, tabs with content)
                const details = `
                    <div class="match-details">
                        ${youtubeLink}
                        ${matchInfo}
                        ${refereeSection}
                        ${timeline}
                        ${matchTabs}
                        ${tabPanels}
                    </div>
                `;

                return `
                    <div class="match-card" data-match-id="${match.id}" onclick="toggleMatchCard(this)">
                        ${oneliner}
                        ${details}
                    </div>
                `;
            }).join('');
        }

        // Search function removed - search bar deleted
        // function filterMatchesBySearch() {
        //     ...
        // }
    </script>
</body>
</html>
