    <title>Soccer Highlights</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html {
            overflow-y: scroll; /* Always show scrollbar to prevent shift */
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            background-attachment: fixed;
            padding: 20px;
            min-height: 100vh;
            -webkit-overflow-scrolling: touch;
        }
        
        .container { max-width: 1200px; margin: 0 auto; }
        
        .header-design-container {
            overflow: hidden;
            margin-bottom: 10px;
            border-radius: 8px;
            max-height: 200px; /* 50% narrower window */
        }
        
        .header-design {
            width: 100%;
            height: auto;
            transform: scaleY(0.7) translateY(-25%); /* Zoom reduced to 1.2, shift up */
            transform-origin: top center; /* Scale from top center */
        }
        
        h1 { color: #333; font-size: 2.5em; margin-bottom: 10px; }
        .subtitle { color: #666; font-size: 1.1em; }
        
        .league-selector {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            min-height: 140px;
        }
        
        .league-buttons {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 10px;
        }
        
        .league-btn {
            padding: 20px;
            background: white;
            border: none;
            border-radius: 12px;
            font-size: 0em; /* Hide text */
            font-weight: 600;
            color: #c8102e;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .league-btn img {
            width: 60px !important; /* Bigger icons */
            height: 60px !important;
        }
        
        .banner-player-img {
            width: 100%;
            height: 150px;
            object-fit: contain;
            object-position: top;
            display: block;
        }
        
        .league-btn:hover {
            background: #c8102e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(200, 16, 46, 0.3);
        }
        
        .league-btn.active {
            background: #c8102e;
            color: white;
        }
        
        /* Standings Table */
        .standings-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .standings-header {
            font-size: 1.3em;
            font-weight: 700;
            color: #c8102e;
            margin-bottom: 15px;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .standings-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
            overflow-x: auto;
        }
        
        .standings-tab {
            padding: 8px 12px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            color: #666;
            font-weight: 600;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s;
            white-space: normal;
            text-align: center;
            line-height: 1.2;
        }
        
        .standings-tab:hover {
            color: #c8102e;
            background: #fafafa;
        }
        
        .standings-tab.active {
            color: #c8102e;
            border-bottom-color: #c8102e;
        }
        
        .standings-table {
            overflow-x: auto;
        }
        
        .standings-table table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        
        .standings-table th {
            background: #f5f5f5;
            padding: 18px 8px;
            text-align: left;
            font-weight: 600;
            color: #333;
            font-size: 28px;
            border-bottom: 2px solid #e0e0e0;
            white-space: nowrap;
        }
        
        .standings-table th:first-child {
            width: 60px;
            text-align: center;
        }
        
        .standings-table td {
            padding: 18px 8px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 28px;
            white-space: nowrap;
        }
        
        .standings-table tr:hover {
            background: #fafafa;
        }
        
        .standings-position {
            text-align: center;
            font-weight: 700;
            color: #666;
        }
        
        .standings-team {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .standings-team img {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }
        
        .standings-stats {
            text-align: center;
            color: #666;
        }
        
        .standings-points {
            text-align: center;
            font-weight: 700;
            color: #c8102e;
        }
        
        .standings-toggle {
            text-align: center;
            padding: 12px;
            margin-top: 10px;
            color: #c8102e;
            font-weight: 600;
            cursor: pointer;
            border-top: 2px solid #f0f0f0;
            transition: background 0.3s;
        }
        
        .standings-toggle:hover {
            background: #fafafa;
        }
        
        .stats-section-toggle {
            text-align: center;
            padding: 12px 24px;
            margin-bottom: 15px;
            background: white;
            border-radius: 15px;
            border: 2px solid #c8102e;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            color: #c8102e;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .stats-section-toggle:hover {
            background: #fafafa;
            transform: translateY(-2px);
        }
        
        .filters {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            min-height: 80px;
        }
        
        .league-dropdown {
            display: none;
        }
        
        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }
        
        .modal-overlay.active {
            display: block;
        }
        
        .modal-content {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            position: relative;
            padding: 20px;
        }
        
        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #c8102e;
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            font-size: 24px;
            cursor: pointer;
            line-height: 1;
            z-index: 10;
        }
        
        .modal-close:hover {
            background: #a00d25;
        }
        
        .filter-btn {
            padding: 12px 24px;
            background: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: 600;
            color: #c8102e;
            cursor: pointer;
            transition: all 0.3s;
            flex: 0 0 calc(33.333% - 10px);
        }

        .filter-btn:hover {
            background: #c8102e;
            color: white;
        }

        .filter-btn.active {
            background: #c8102e;
            color: white;
        }
        
        /* Match Statistics */
        .match-stats-container {
            margin: 20px 0 0 0;
            padding: 15px;
            background: #fafafa;
            border-radius: 8px;
        }
        
        .match-stats-header {
            font-weight: 700;
            color: #c8102e;
            margin-bottom: 15px;
            text-align: center;
            font-size: 1.1em;
        }
        
        .match-stats-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .stat-row {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            align-items: center;
            padding: 10px;
            background: white;
            border-radius: 6px;
        }
        
        .stat-home {
            text-align: center;
            font-weight: normal;
            font-size: 0.95em;
            color: #666;
        }
        
        .stat-label {
            text-align: center;
            color: #666;
            font-size: 0.95em;
            font-weight: normal;
        }
        
        .stat-away {
            text-align: center;
            font-weight: normal;
            font-size: 0.95em;
            color: #666;
        }
        
        .stat-highlight {
            background-color: #c8102e;
            color: white !important;
            font-weight: normal;
            border-radius: 4px;
            padding: 2px 8px;
        }
        
        .standings-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
            color: #666;
        }
        
        .standings-table th {
            background: #f5f5f5;
            padding: 8px 4px;
            text-align: center;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #ddd;
        }
        
        .standings-table td {
            padding: 6px 4px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }
        
        .standings-table tr.standings-highlight {
            background-color: #e0e0e0;
            color: #333;
        }
        
        .standings-table tr.standings-highlight td {
            color: #333;
            border-bottom-color: #d0d0d0;
        }
        
        /* Match Tabs */
        .match-tabs {
            display: flex;
            gap: 8px;
            margin: 15px 0 10px 0;
            border-bottom: 2px solid #ddd;
        }
        
        .match-tab {
            flex: 1;
            padding: 10px 8px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            color: #666;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .match-tab:hover {
            color: #c8102e;
            background: #f9f9f9;
        }
        
        .match-tab.active {
            color: #c8102e;
            border-bottom-color: #c8102e;
        }
        
        .match-tab-panel {
            display: none;
        }
        
        .match-tab-panel.active {
            display: block;
        }
        
        /* Team Shields */
        .team-shields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 15px;
            padding: 0 20px;
        }
        
        .shield-home {
            text-align: left;
        }
        
        .shield-away {
            text-align: right;
        }
        
        .shield-home img, .shield-away img {
            object-fit: contain;
        }
        
        /* Search Bar */
        .search-container {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        .search-input {
            width: 100%;
            max-width: 500px;
            padding: 12px 20px;
            font-size: 1em;
            border: 2px solid #c8102e;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .search-input:focus {
            border-color: #c8102e;
        }
        
        .search-input::placeholder {
            color: #999;
        }
        
        .matches-container { display: grid; gap: 8px; }
        
        /* Collapsed card - one liner */
        .match-card {
            background: white;
            border-radius: 8px;
            padding: 12px 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: all 0.3s;
            overflow: hidden;
        }

        .match-card:hover {
            background: #f8f8f8;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }

        /* One-liner display */
        .match-oneliner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px; /* Add spacing */
            font-size: 1em;
            color: #333;
        }

        .match-oneliner .team-logo {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .match-oneliner .team-name {
            font-weight: 600;
            text-align: center;
        }

        .match-oneliner .score {
            font-weight: bold;
            color: #c8102e;
            padding: 0;
            font-size: 1.1em;
            width: 40px;
            text-align: center;
            display: inline-block;
        }
        
        .live-minute {
            font-size: 0.75em;
            color: #c8102e;
            font-weight: 600;
            margin-right: 8px;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .live-dot {
            display: inline-block;
            animation: blink 1.5s ease-in-out infinite;
            animation-delay: -0.75s; /* Start all dots at same point in animation cycle */
        }
        
        .match-oneliner .date {
            font-size: 1.2em;
            font-weight: 500;
        }

        .match-oneliner .date {
            color: #999;
            font-size: 0.9em;
            white-space: nowrap;
        }
        
        .match-oneliner .date-mobile {
            display: none;
        }

        /* Expanded card details - hidden by default */
        .match-details {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #f0f0f0;
        }

        .match-card.expanded .match-details {
            display: block;
        }

        .match-card.expanded {
            cursor: default;
            padding: 20px;
        }

        .match-card.expanded:hover {
            background: white;
        }
        
        .match-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .match-info { display: flex; gap: 15px; align-items: center; font-size: 0.9em; color: #666; }
        
        .matchday {
            background: #e0e0e0;
            color: #333;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
        }
        
        .match-content {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        
        .team { 
            flex: 0 0 auto; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            width: 350px;
        }
        .team.home { justify-content: flex-end; }
        .team.away { justify-content: flex-end; flex-direction: row-reverse; }
        .team-logo { width: 50px; height: 50px; object-fit: contain; }
        .team-name { font-size: 1.2em; font-weight: 600; color: #333; }
        
        .score {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 2em;
            font-weight: bold;
            width: 150px;
            justify-content: center;
        }
        
        .score-separator { color: #ccc; }
        .match-date { text-align: center; color: #999; font-size: 0.9em; margin-top: 10px; }
        .loading { text-align: center; color: #666; font-size: 1.5em; padding: 50px; }
        .error { background: #f44336; color: white; padding: 20px; border-radius: 12px; text-align: center; }
        
        .youtube-btn {
            display: block;
            margin: 15px auto 0 auto;
            padding: 10px 20px;
            background: #888;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.3s;
            text-align: center;
            width: fit-content;
        }
        
        .youtube-btn:hover {
            background: #666;
        }
        
        /* Video tabs */
        .video-tabs {
            display: flex;
            gap: 8px;
            margin-top: 15px;
            margin-bottom: 10px;
        }
        
        .video-tab {
            flex: 1;
            padding: 10px 16px;
            background: #f0f0f0;
            border: none;
            border-radius: 8px 8px 0 0;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            color: #666;
        }
        
        .video-tab:hover {
            background: #e0e0e0;
        }
        
        .video-tab.active {
            background: #c8102e;
            color: white;
        }
        
        .video-content {
            position: relative;
        }
        
        .video-panel {
            display: none;
        }
        
        .video-panel.active {
            display: block;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 315px;
        }

        .video-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #c8102e 0%, #8b0a1f 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 8px;
            color: white;
            font-size: 1.5em;
            font-weight: bold;
            z-index: 10;
        }

        .video-placeholder:hover {
            opacity: 0.9;
        }

        .video-placeholder.hidden {
            display: none;
        }
        
        /* Enhanced match info styles */
        .match-info-line {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 6px;
            text-align: center;
        }
        
        .referee-section {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 15px;
            padding: 8px;
            background: #f5f5f5;
            border-radius: 4px;
            text-align: center;
        }
        
        /* Match Timeline - Two Column Layout */
        .match-timeline {
            margin: 15px 0;
            padding: 20px;
            background: #fafafa;
            border-radius: 8px;
        }
        
        .timeline-section {
            margin-bottom: 20px;
        }
        
        .timeline-section:last-child {
            margin-bottom: 0;
        }
        
        .timeline-section-icon {
            text-align: center;
            font-size: 1.5em;
            margin-bottom: 10px;
        }
        
        .timeline-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .timeline-column {

        }
        
        .timeline-column.home-column {
            text-align: left;
        }
        
        .timeline-column.away-column {
            text-align: right;
        }
        
        .timeline-item {
            padding: 6px 0;
            font-size: 0.95em;
            color: #666;
            font-weight: normal;
        }
        
        .starter-item {

        .starters-container {

            gap: 2px;

        .starters-row {

            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .starters-home {
            text-align: left;
        }
        
        .starters-away {
            text-align: right;
        }

            header {

            .subtitle {

<body>
    <div class="container">
        <div class="header-design-container">
            <img src="soccer_highlights_design.png" alt="Soccer Highlights" class="header-design" style="width: 100%; height: auto; display: block;">
        </div>
        
        <div class="league-selector" id="leagueSelector">
            <div id="leagueButtons" class="league-buttons"></div>
        </div>

        <div class="filters" id="filtersContainer">
            <div class="league-dropdown">
                <select id="leagueDropdown" onchange="selectLeagueFromDropdown(this.value)">
                    <option value="">League</option>
                </select>
            </div>
            <button class="filter-btn active" id="recentBtn" onclick="setMatchFilter('recent')">Finished</button>
            <button class="filter-btn" id="liveBtn" onclick="setMatchFilter('live')">Live</button>
            <button class="filter-btn" id="upcomingBtn" onclick="setMatchFilter('upcoming')">Upcoming</button>
        </div>

        <div class="matches-container" id="matchesContainer"></div>
        
        <div class="modal-overlay" id="matchModal" onclick="if(event.target === this) closeMatchModal()">
            <div class="modal-content">
                <button class="modal-close" onclick="closeMatchModal()">×</button>
                <div id="modalMatchContent"></div>
            </div>
        </div>
    </div>

    <script>
        let allLeaguesData = {};
        let highlightsDatabase = {};
        let matchStatistics = {};
        let head2headData = {}; // Store head2head historical matches
        let currentLeague = null;
        let currentLeagueCode = null;
        let currentMatches = [];
        let currentFilter = 'recent';
        let statsExpanded = false; // Track if stats section is expanded

        // Automatically load data on page load
        window.addEventListener('DOMContentLoaded', function() {
            // Load league data, highlights database, match statistics, and head2head data
            Promise.all([
                fetch('output/all_leagues.json').then(r => r.json()),
                fetch('output/highlights_database.json').then(r => r.json()),
                fetch('output/match_statistics.json').then(r => r.json()).catch(() => ({})), // Optional: graceful fail
                fetch('head2head.json').then(r => r.json()).catch(() => ({})) // Optional: graceful fail
            ])
            .then(([leaguesData, highlightsData, statsData, h2hData]) => {
                allLeaguesData = leaguesData;
                highlightsDatabase = highlightsData.highlights;
                matchStatistics = statsData;
                head2headData = h2hData;
                console.log('Loaded head2head data for', Object.keys(head2headData).length, 'matches');
                populateLeagueSelector();
                document.getElementById('leagueSelector').classList.add('show');
            })
            .catch(error => {
                console.log('Auto-load failed:', error);
                document.getElementById('matchesContainer').innerHTML = 
                    '<div class="error">Failed to load league data. Please try again later.</div>';
            });
        });

        // Populate league selector with buttons in custom order
        function populateLeagueSelector() {
            const container = document.getElementById('leagueButtons');
            container.innerHTML = '';
            
            // Define custom order for top leagues
            const customOrder = ['CL', 'PD', 'PL', 'FL1', 'BL1', 'SA'];
            
            // Separate leagues into priority and rest
            const priorityLeagues = [];
            const otherLeagues = [];
            
            Object.keys(allLeaguesData).forEach(code => {
                if (customOrder.includes(code)) {
                    priorityLeagues.push(code);
                } else {
                    otherLeagues.push(code);
                }
            });
            
            // Sort priority leagues by custom order
            priorityLeagues.sort((a, b) => customOrder.indexOf(a) - customOrder.indexOf(b));
            
            // Sort other leagues alphabetically
            otherLeagues.sort((a, b) => {
                const nameA = allLeaguesData[a].name.toUpperCase();
                const nameB = allLeaguesData[b].name.toUpperCase();
                return nameA.localeCompare(nameB);
            });
            
            // Combine: priority first, then others
            const sortedLeagues = [...priorityLeagues, ...otherLeagues];
            
            sortedLeagues.forEach(code => {
                const league = allLeaguesData[code];
                const button = document.createElement('button');
                button.className = 'league-btn';
                const emblem = league.matches?.[0]?.competition?.emblem || '';
                button.innerHTML = `<img src="${emblem}" style="width: 36px; height: 36px; margin-right: 8px; vertical-align: middle;" onerror="this.style.display='none'">${league.name}`;
                button.onclick = () => selectLeague(code, button);
                container.appendChild(button);
            });

            // Auto-select La Liga by default
            const pdButton = container.querySelector('button:nth-child(2)'); // PD is 2nd in custom order (CL, PD, PL)
            if (pdButton) {
                pdButton.click();
            }
            
            // Populate dropdown with league options including emblems
            const dropdown = document.getElementById('leagueDropdown');
            if (dropdown) {
                dropdown.innerHTML = ''; // Clear existing options
                sortedLeagues.forEach(code => {
                    const league = allLeaguesData[code];
                    const option = document.createElement('option');
                    option.value = code;
                    const emblem = league.matches?.[0]?.competition?.emblem || '';
                    // Use league code as text since we can't easily embed images in options
                    option.textContent = code;
                    // Store emblem as data attribute
                    option.setAttribute('data-emblem', emblem);
                    dropdown.appendChild(option);
                });
                dropdown.value = 'PD';
                
                // Update dropdown visual to show selected league's emblem
                updateDropdownEmblem('PD');
            }
        }
        
        function updateDropdownEmblem(leagueCode) {
            const dropdown = document.getElementById('leagueDropdown');
            if (!dropdown || !allLeaguesData[leagueCode]) return;
            
            const emblem = allLeaguesData[leagueCode].matches?.[0]?.competition?.emblem || '';
            if (emblem) {
                dropdown.style.backgroundImage = `url('${emblem}')`;
                dropdown.style.backgroundSize = '20px 20px';
                dropdown.style.backgroundPosition = '6px center';
                dropdown.style.backgroundRepeat = 'no-repeat';
                dropdown.style.paddingLeft = '30px';
            }
        }

        function selectLeagueFromDropdown(leagueCode) {
            console.log('Dropdown changed to:', leagueCode);
            if (!leagueCode) return;
            
            currentLeagueCode = leagueCode;
            currentLeague = allLeaguesData[leagueCode];
            currentMatches = currentLeague.matches;
            
            console.log('Current league:', currentLeague.name);
            console.log('Number of matches:', currentMatches.length);
            
            // Update dropdown emblem
            updateDropdownEmblem(leagueCode);
            
            // Track league selection
            trackEvent('select_league', {
                league_name: currentLeague.name,
                league_code: leagueCode
            });
            
            // Calculate and display standings from match data
            calculateStandings(leagueCode);
            
            document.getElementById('filtersContainer').style.display = 'flex';
            
            // Update button states for desktop
            document.querySelectorAll('.league-btn').forEach(btn => {
                if (btn.getAttribute('onclick') && btn.getAttribute('onclick').includes(leagueCode)) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            // Show finished matches by default
            setMatchFilter(currentFilter);
        }

        function selectLeague(leagueCode, button) {
            // Remove active class from all buttons
            document.querySelectorAll('.league-btn').forEach(btn => btn.classList.remove('active'));
            // Add active class to clicked button
            button.classList.add('active');
            
            // Update dropdown
            const dropdown = document.getElementById('leagueDropdown');
            if (dropdown) {
                dropdown.value = leagueCode;
                updateDropdownEmblem(leagueCode);
            }
            
            currentLeagueCode = leagueCode;
            currentLeague = allLeaguesData[leagueCode];
            currentMatches = currentLeague.matches;
            
            // Track league selection
            trackEvent('select_league', {
                league_name: currentLeague.name,
                league_code: leagueCode
            });
            
            // Calculate and display standings from match data
            calculateStandings(leagueCode);
            
            document.getElementById('filtersContainer').style.display = 'flex';
            
            // Show finished matches by default
            setMatchFilter(currentFilter);
        }

        function calculateStandings(leagueCode) {
            const matches = allLeaguesData[leagueCode].matches;
            const teams = {};
            
            // Process all finished matches
            matches.forEach(match => {
                if (match.status !== 'FINISHED' || !match.score?.fullTime) return;
                
                const homeTeam = match.homeTeam;
                const awayTeam = match.awayTeam;
                const homeScore = match.score.fullTime.home;
                const awayScore = match.score.fullTime.away;
                
                // Initialize teams if not exists
                if (!teams[homeTeam.id]) {
                    teams[homeTeam.id] = {
                        team: homeTeam,
                        playedGames: 0,
                        won: 0,
                        draw: 0,
                        lost: 0,
                        goalsFor: 0,
                        goalsAgainst: 0,
                        goalDifference: 0,
                        points: 0,
                        matches: [] // Store matches for last 5
                    };
                }
                if (!teams[awayTeam.id]) {
                    teams[awayTeam.id] = {
                        team: awayTeam,
                        playedGames: 0,
                        won: 0,
                        draw: 0,
                        lost: 0,
                        goalsFor: 0,
                        goalsAgainst: 0,
                        goalDifference: 0,
                        points: 0,
                        matches: [] // Store matches for last 5
                    };
                }
                
                // Store match result for each team
                teams[homeTeam.id].matches.push({
                    date: new Date(match.utcDate),
                    homeScore: homeScore,
                    awayScore: awayScore,
                    isHome: true
                });
                teams[awayTeam.id].matches.push({
                    date: new Date(match.utcDate),
                    homeScore: homeScore,
                    awayScore: awayScore,
                    isHome: false
                });
                
                // Update stats
                teams[homeTeam.id].playedGames++;
                teams[awayTeam.id].playedGames++;
                
                teams[homeTeam.id].goalsFor += homeScore;
                teams[homeTeam.id].goalsAgainst += awayScore;
                teams[awayTeam.id].goalsFor += awayScore;
                teams[awayTeam.id].goalsAgainst += homeScore;
                
                if (homeScore > awayScore) {
                    teams[homeTeam.id].won++;
                    teams[homeTeam.id].points += 3;
                    teams[awayTeam.id].lost++;
                } else if (homeScore < awayScore) {
                    teams[awayTeam.id].won++;
                    teams[awayTeam.id].points += 3;
                    teams[homeTeam.id].lost++;
                } else {
                    teams[homeTeam.id].draw++;
                    teams[awayTeam.id].draw++;
                    teams[homeTeam.id].points += 1;
                    teams[awayTeam.id].points += 1;
                }
                
                teams[homeTeam.id].goalDifference = teams[homeTeam.id].goalsFor - teams[homeTeam.id].goalsAgainst;
                teams[awayTeam.id].goalDifference = teams[awayTeam.id].goalsFor - teams[awayTeam.id].goalsAgainst;
            });
            
            // Calculate Last 5 for each team
            Object.values(teams).forEach(team => {
                // Sort matches by date (most recent first)
                team.matches.sort((a, b) => b.date - a.date);
                
                // Take last 5 matches
                const last5Matches = team.matches.slice(0, 5);
                
                // Generate form string with symbols (reverse so most recent is on right)
                team.last5 = last5Matches.map(match => {
                    const teamScore = match.isHome ? match.homeScore : match.awayScore;
                    const opponentScore = match.isHome ? match.awayScore : match.homeScore;
                    
                    if (teamScore > opponentScore) return '✓'; // Win - green checkmark
                    if (teamScore < opponentScore) return '✗'; // Loss - red X
                    return '−'; // Draw - gray dash
                }).reverse().join(' '); // REVERSE so most recent is rightmost
                
                // If less than 5 matches, pad with spaces on the LEFT
                while (team.last5.split(' ').length < 5) {
                    team.last5 = '− ' + team.last5;
                }
            });
            
            // Convert to array and sort by points, then goal difference
            const standings = Object.values(teams).sort((a, b) => {
                if (b.points !== a.points) return b.points - a.points;
                if (b.goalDifference !== a.goalDifference) return b.goalDifference - a.goalDifference;
                return b.goalsFor - a.goalsFor;
            });
            
            // Add position
            standings.forEach((team, index) => {
                team.position = index + 1;
            });
            
            if (standings.length > 0) {
                // Store data for tab switching
                window.currentLeagueStats = {
                    standings: standings,
                    matches: allLeaguesData[leagueCode].matches
                };
                // Standings now shown in match cards
                // displayStandings(standings);
            }
        }

        function switchStatsTab(tabName) {
            // Update active tab
            document.querySelectorAll('.standings-tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            
            const container = document.getElementById('standingsTable');
            container.dataset.expanded = 'false'; // Reset expansion when switching tabs
            
            if (!window.currentLeagueStats) return;
            
            switch(tabName) {
                case 'standings':
                    displayStandings(window.currentLeagueStats.standings);
                    break;
                case 'goals':
                    displayTopScorers(window.currentLeagueStats.matches);
                    break;
                case 'assists':
                    displayTopAssisters(window.currentLeagueStats.matches);
                    break;
                case 'yellow':
                    displayTopYellowCards(window.currentLeagueStats.matches);
                    break;
                case 'red':
                    displayTopRedCards(window.currentLeagueStats.matches);
                    break;
            }
        }

        function displayTopScorers(matches) {
            const scorers = {};
            
            matches.forEach(match => {
                if (!match.goals) return;
                match.goals.forEach(goal => {
                    const scorer = goal.scorer?.name;
                    const scorerId = goal.scorer?.id;
                    if (!scorer || !scorerId) return;
                    
                    if (!scorers[scorerId]) {
                        scorers[scorerId] = {
                            name: scorer,
                            team: goal.team?.name || '',
                            goals: 0
                        };
                    }
                    scorers[scorerId].goals++;
                });
            });
            
            const topScorers = Object.values(scorers)
                .sort((a, b) => b.goals - a.goals)
                .slice(0, 6);
            
            displayPlayerStats(topScorers, 'Goals', 'goals');
        }

        function displayTopAssisters(matches) {
            const assisters = {};
            
            matches.forEach(match => {
                if (!match.goals) return;
                match.goals.forEach(goal => {
                    const assister = goal.assist?.name;
                    const assisterId = goal.assist?.id;
                    if (!assister || !assisterId) return;
                    
                    if (!assisters[assisterId]) {
                        assisters[assisterId] = {
                            name: assister,
                            team: goal.team?.name || '',
                            assists: 0
                        };
                    }
                    assisters[assisterId].assists++;
                });
            });
            
            const topAssisters = Object.values(assisters)
                .sort((a, b) => b.assists - a.assists)
                .slice(0, 6);
            
            displayPlayerStats(topAssisters, 'Assists', 'assists');
        }

        function displayTopYellowCards(matches) {
            const yellowCards = {};
            
            matches.forEach(match => {
                if (!match.bookings) return;
                match.bookings.forEach(booking => {
                    if (booking.card !== 'YELLOW') return;
                    const player = booking.player?.name;
                    const playerId = booking.player?.id;
                    if (!player || !playerId) return;
                    
                    if (!yellowCards[playerId]) {
                        yellowCards[playerId] = {
                            name: player,
                            team: booking.team?.name || '',
                            yellows: 0
                        };
                    }
                    yellowCards[playerId].yellows++;
                });
            });
            
            const topYellows = Object.values(yellowCards)
                .sort((a, b) => b.yellows - a.yellows)
                .slice(0, 6);
            
            displayPlayerStats(topYellows, 'Yellow Cards', 'yellows');
        }

        function displayTopRedCards(matches) {
            const redCards = {};
            
            matches.forEach(match => {
                if (!match.bookings) return;
                match.bookings.forEach(booking => {
                    if (booking.card !== 'RED' && booking.card !== 'YELLOW_RED' && booking.card !== 'SECOND_YELLOW') return;
                    const player = booking.player?.name;
                    const playerId = booking.player?.id;
                    if (!player || !playerId) return;
                    
                    if (!redCards[playerId]) {
                        redCards[playerId] = {
                            name: player,
                            team: booking.team?.name || '',
                            reds: 0
                        };
                    }
                    redCards[playerId].reds++;
                });
            });
            
            const topReds = Object.values(redCards)
                .sort((a, b) => b.reds - a.reds)
                .slice(0, 6);
            
            displayPlayerStats(topReds, 'Red Cards', 'reds');
        }

        function displayPlayerStats(players, statName, statKey) {
            const container = document.getElementById('standingsTable');
            
            if (players.length === 0) {
                container.innerHTML = `<div style="text-align: center; padding: 20px; color: #999;">No data available</div>`;
                return;
            }
            
            const tableHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Player</th>
                            <th>Team</th>
                            <th>${statName}</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${players.map((player, index) => `
                            <tr>
                                <td class="standings-position">${index + 1}</td>
                                <td style="font-weight: 600;">${player.name}</td>
                                <td style="color: #666; font-size: 0.85em;">${player.team}</td>
                                <td class="standings-points">${player[statKey]}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            
            container.innerHTML = tableHTML;
        }

        function displayStandings(standings) {
            const container = document.getElementById('standingsTable');
            const showAll = container.dataset.expanded === 'true';
            const teamsToShow = showAll ? standings : standings.slice(0, 6);
            
            const tableHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Team</th>
                            <th>MP</th>
                            <th>W</th>
                            <th>D</th>
                            <th>L</th>
                            <th>GD</th>
                            <th>Pts</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${teamsToShow.map(team => `
                            <tr>
                                <td class="standings-position">${team.position}</td>
                                <td>
                                    <div class="standings-team">
                                        <img src="${team.team.crest}" alt="${team.team.shortName}" onerror="this.style.display='none'">
                                        <span>${team.team.shortName}</span>
                                    </div>
                                </td>
                                <td class="standings-stats">${team.playedGames}</td>
                                <td class="standings-stats">${team.won}</td>
                                <td class="standings-stats">${team.draw}</td>
                                <td class="standings-stats">${team.lost}</td>
                                <td class="standings-stats">${team.goalDifference > 0 ? '+' : ''}${team.goalDifference}</td>

        function setMatchFilter(filter) {
            currentFilter = filter;
            
            // Track filter change
            trackEvent('change_filter', {
                filter: filter,
                league_code: currentLeagueCode
            });
            
            // Update button states
            document.getElementById('recentBtn').classList.toggle('active', filter === 'recent');
            document.getElementById('liveBtn').classList.toggle('active', filter === 'live');
            document.getElementById('upcomingBtn').classList.toggle('active', filter === 'upcoming');
            
            // Filter matches
            let filtered = currentMatches;
            const now = new Date();
            
            if (filter === 'live') {
                // Show matches that are live (within 2 hours after start time and not finished)
                filtered = filtered
                    .filter(m => {
                        const matchStart = new Date(m.utcDate);
                        const twoHoursAfterStart = new Date(matchStart.getTime() + (2 * 60 * 60 * 1000));
                        const isWithinWindow = now >= matchStart && now <= twoHoursAfterStart;
                        const notFinished = m.status !== 'FINISHED';
                        return isWithinWindow && notFinished;
                    })
                    .sort((a, b) => new Date(a.utcDate) - new Date(b.utcDate));
            } else if (filter === 'upcoming') {
                filtered = filtered
                    .filter(m => m.status === 'SCHEDULED' || m.status === 'TIMED')
                    .filter(m => new Date(m.utcDate) >= now)
                    .sort((a, b) => new Date(a.utcDate) - new Date(b.utcDate));
            } else {
                // Show matches that are finished OR have a video
                filtered = filtered
                    .filter(m => {
                        const matchDate = new Date(m.utcDate).toISOString().split('T')[0];
                        const matchKey = `${m.homeTeam.name}-${m.awayTeam.name}-${matchDate}`;
                        const hasVideo = highlightsDatabase[currentLeagueCode]?.['2025-26']?.[matchKey]?.videoId;
                        return m.status === 'FINISHED' || hasVideo;
                    })
                    .sort((a, b) => new Date(b.utcDate) - new Date(a.utcDate));
            }
            
            displayMatches(filtered);
            updateLiveButtonIndicator();
        }
        
        function updateLiveButtonIndicator() {
            const now = new Date();
            const hasLiveGames = currentMatches.some(m => {
                const matchStart = new Date(m.utcDate);
                const twoHoursAfterStart = new Date(matchStart.getTime() + (2 * 60 * 60 * 1000));
                const isWithinWindow = now >= matchStart && now <= twoHoursAfterStart;
                const notFinished = m.status !== 'FINISHED';
                return isWithinWindow && notFinished;
            });
            
            const liveBtn = document.getElementById('liveBtn');
            
            // Hide dot when Live filter is active, show when there are live games and filter is not active
            if (hasLiveGames && currentFilter !== 'live') {
                if (!liveBtn.querySelector('.live-dot')) {
                    liveBtn.innerHTML = 'Live <span class="live-dot" style="position: absolute; top: 8px; right: 8px; font-size: 0.6em;">🔴</span>';
                    liveBtn.style.position = 'relative';
                }
            } else {
                liveBtn.innerHTML = 'Live';
                liveBtn.style.position = '';
            }
        }

                const firstPanel = detailsClone.querySelector('[id^="video-"]');

        function displayMatches(matches) {
            const container = document.getElementById('matchesContainer');
            
            if (matches.length === 0) {
                container.innerHTML = '<div class="loading">No matches found</div>';
                return;
            }

            container.innerHTML = matches.map(match => {
                const homeScore = match.score?.fullTime?.home ?? '-';
                const awayScore = match.score?.fullTime?.away ?? '-';
                
                // Full date for desktop
                const date = new Date(match.utcDate).toLocaleString(undefined, {
                    weekday: 'short',
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                
                // Short date for mobile: "Mon 1/4/26 15:00" (24-hour format)
                const matchDate = new Date(match.utcDate);
                const dayOfWeek = matchDate.toLocaleDateString(undefined, { weekday: 'short' });
                const year = String(matchDate.getFullYear()).slice(-2);
                const hours = String(matchDate.getHours()).padStart(2, '0');
                const minutes = String(matchDate.getMinutes()).padStart(2, '0');
                const shortDate = `${dayOfWeek} ${matchDate.getMonth()+1}/${matchDate.getDate()}/${year} ${hours}:${minutes}`;

                const homeWinner = match.score?.winner === 'HOME_TEAM' ? 'winner' : '';
                const awayWinner = match.score?.winner === 'AWAY_TEAM' ? 'winner' : '';

                // Check if match is live (in progress)
                const now = new Date();
                const matchStart = new Date(match.utcDate);
                const twoHoursAfterStart = new Date(matchStart.getTime() + (2 * 60 * 60 * 1000));
                const isLive = now >= matchStart && now <= twoHoursAfterStart && match.status !== 'FINISHED';
                const currentMinute = match.minute || 0;
                
                // Build score section with optional live minute
                let scoreSection = `<span class="score">${homeScore} - ${awayScore}</span>`;
                
                // Live minute indicator at start of line
                let liveIndicator = '';
                if (isLive && currentMinute > 0) {
                    liveIndicator = `<span class="live-minute"><span class="live-dot">🔴</span> ${currentMinute}'</span>`;
                }

                // One-liner format: [live indicator] shield-name-score-name-shield
                const oneliner = `<div class="match-oneliner">${liveIndicator}<img src="${match.homeTeam.crest}" class="team-logo" alt="${match.homeTeam.tla}" onerror="this.style.display='none'"><span class="team-name">${match.homeTeam.tla}</span>${scoreSection}<span class="team-name">${match.awayTeam.tla}</span><img src="${match.awayTeam.crest}" class="team-logo" alt="${match.awayTeam.tla}" onerror="this.style.display='none'"><span class="date date-desktop">${date}</span><span class="date date-mobile">${shortDate}</span></div>`;

                let youtubeLink = '';

                // Only show video/search button if match has finished (not live, not upcoming)
                const matchTime = new Date(match.utcDate);
                const hasStarted = matchTime <= now; // Reuse 'now' from above
                const hasFinished = match.status === 'FINISHED' || !isLive;

                if (hasStarted && hasFinished) {
                    const matchDate = new Date(match.utcDate).toISOString().split('T')[0];
                    const matchKey = `${match.homeTeam.name}-${match.awayTeam.name}-${matchDate}`;
                    const season = '2025-26';
                    const matchData = highlightsDatabase[currentLeagueCode]?.[season]?.[matchKey];
                    
                    // Support both old format (videoId) and new format (videoIds array)
                    let videoIds = matchData?.videoIds;
                    if (!videoIds && matchData?.videoId) {
                        // Old format: convert single videoId to array
                        videoIds = [matchData.videoId];
                    }
                    
                    // Always create search button
                    const youtubeSearchQuery = `${match.homeTeam.name} vs ${match.awayTeam.name} highlights`;
                    const searchButton = `
                        <div style="text-align: center; margin-top: 10px; margin-bottom: 15px;">
                            <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(youtubeSearchQuery)}" 
                               target="_blank" 
                               class="youtube-btn"
                               onclick="trackEvent('search_youtube', {league: '${currentLeagueCode}', home: '${match.homeTeam.shortName}', away: '${match.awayTeam.shortName}'})">Find more videos</a>
                        </div>
                    `;
                    
                    if (videoIds && videoIds.length > 0) {
                        // Create tabs for multiple videos
                        const uniqueId = `video-${match.id}`;
                        let videoTabs = '<div class="video-tabs">';
                        let videoContent = '<div class="video-content">';
                        
                        // Limit to top 4 videos
                        const videosToShow = videoIds.slice(0, 4);
                        
                        videosToShow.forEach((videoId, index) => {
                            const active = index === 0 ? 'active' : '';
                            videoTabs += `<button class="video-tab ${active}" onclick="switchVideo('${uniqueId}', ${index}, event)">Video ${index + 1}</button>`;
                            
                            videoContent += `
                                <div class="video-panel ${active}" id="${uniqueId}-${index}">
                                    <iframe width="100%" height="315" 
                                         src="https://www.youtube.com/embed/${videoId}?mute=1&vq=hd1080"
                                         frameborder="0" 
                                         allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                                         referrerpolicy="strict-origin-when-cross-origin"
                                         allowfullscreen
                                         loading="lazy"
                                         style="border-radius: 8px;">
                                    </iframe>
                                </div>
                            `;
                        });
                        
                        videoTabs += '</div>';
                        videoContent += '</div>';
                        
                        youtubeLink = videoTabs + videoContent + searchButton;
                    } else {
                        // No videos - just show search button
                        youtubeLink = searchButton;
                    }
                }

                // Enhanced match details
                let matchInfo = '';
                
                // Venue and Attendance (no city)
                if (match.venue || match.attendance) {
                    const venueText = match.venue ? `📍 ${match.venue}` : '';
                    const attendanceText = match.attendance ? `👥 ${match.attendance.toLocaleString()}` : '';
                    const separator = venueText && attendanceText ? ' • ' : '';
                    matchInfo = `<div class="match-info-line">${venueText}${separator}${attendanceText}</div>`;
                }
                
                // Referee
                let refereeSection = '';
                if (match.referees && match.referees.length > 0) {
                    const mainRef = match.referees.find(r => r.type === 'REFEREE');
                    if (mainRef) {
                        refereeSection = `<div class="referee-section">👨‍⚖️ Referee: ${mainRef.name}</div>`;
                    }
                }
                
                // Timeline: Two-column layout - home team left, away team right
                let timeline = '';
                
                // Separate goals by team
                const homeGoals = {};
                const awayGoals = {};
                
                if (match.goals && match.goals.length > 0) {
                    match.goals.forEach(goal => {
                        const scorer = goal.scorer?.name || 'Unknown';
                        const minute = goal.injuryTime ? `${goal.minute}+${goal.injuryTime}'` : `${goal.minute}'`;
                        const isHome = goal.team?.id === match.homeTeam.id;
                        const isOwnGoal = goal.type === 'OWN';
                        const isPenalty = goal.type === 'PENALTY';
                        
                        // Own goals show in opposite team's column with (OG) flag
                        const displayInHome = isOwnGoal ? !isHome : isHome;
                        let minuteDisplay = minute;
                        if (isOwnGoal) {
                            minuteDisplay = `${minute} (OG)`;
                        } else if (isPenalty) {
                            minuteDisplay = `${minute} (P)`;
                        }
                        
                        if (displayInHome) {
                            if (!homeGoals[scorer]) homeGoals[scorer] = [];
                            homeGoals[scorer].push(minuteDisplay);
                        } else {
                            if (!awayGoals[scorer]) awayGoals[scorer] = [];
                            awayGoals[scorer].push(minuteDisplay);
                        }
                    });
                }
                
                // Separate red cards by team (RED, YELLOW_RED, or SECOND_YELLOW)
                const homeRedCards = {};
                const awayRedCards = {};
                
                if (match.bookings && match.bookings.length > 0) {
                    match.bookings.forEach(booking => {
                        if (booking.card === 'RED' || booking.card === 'SECOND_YELLOW' || booking.card === 'YELLOW_RED') {
                            const player = booking.player?.name || 'Unknown';
                            const minute = booking.injuryTime ? `${booking.minute}+${booking.injuryTime}'` : `${booking.minute}'`;
                            const isHome = booking.team?.id === match.homeTeam.id;
                            
                            if (isHome) {
                                if (!homeRedCards[player]) homeRedCards[player] = [];
                                homeRedCards[player].push(minute);
                            } else {
                                if (!awayRedCards[player]) awayRedCards[player] = [];
                                awayRedCards[player].push(minute);
                            }
                        }
                    });
                }
                
                // Build home goals HTML
                let homeGoalsHTML = '';
                for (const [player, minutes] of Object.entries(homeGoals)) {
                    homeGoalsHTML += `<div class="timeline-item">${player} ${minutes.join(' ')}</div>`;
                }
                
                // Build away goals HTML
                let awayGoalsHTML = '';
                for (const [player, minutes] of Object.entries(awayGoals)) {
                    awayGoalsHTML += `<div class="timeline-item">${player} ${minutes.join(' ')}</div>`;
                }
                
                // Build home red cards HTML
                let homeRedCardsHTML = '';
                for (const [player, minutes] of Object.entries(homeRedCards)) {
                    homeRedCardsHTML += `<div class="timeline-item">${player} ${minutes.join(' ')}</div>`;
                }
                
                // Build away red cards HTML
                let awayRedCardsHTML = '';
                for (const [player, minutes] of Object.entries(awayRedCards)) {
                    awayRedCardsHTML += `<div class="timeline-item">${player} ${minutes.join(' ')}</div>`;
                }
                
                // Build timeline with two columns
                const hasGoals = homeGoalsHTML || awayGoalsHTML;
                const hasRedCards = homeRedCardsHTML || awayRedCardsHTML;
                
                if (hasGoals || hasRedCards) {
                    let timelineContent = '';
                    
                    // Goals section
                    if (hasGoals) {
                        timelineContent += `
                            <div class="timeline-section">
                                <div class="timeline-section-icon">⚽</div>
                                <div class="timeline-columns">
                                    <div class="timeline-column home-column">${homeGoalsHTML}</div>
                                    <div class="timeline-column away-column">${awayGoalsHTML}</div>
                                </div>

                    // Red cards section
