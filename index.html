<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Meta Tags -->
    <meta name="description" content="Watch free soccer highlights from Premier League, La Liga, Bundesliga, Serie A, and more. Updated daily with the latest match videos.">
    <meta name="keywords" content="soccer highlights, Premier League highlights, La Liga highlights, free soccer videos, match highlights, football highlights">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PQZPKL0WHF"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    
      gtag('config', 'G-PQZPKL0WHF');
      
      // Custom event tracking function
      function trackEvent(eventName, params) {
          gtag('event', eventName, params);
      }
    </script>

    <!-- Microsoft Clarity -->
    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;

    <title>Soccer Highlights</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            background-attachment: fixed;
            padding: 20px;
            min-height: 100vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        .container { max-width: 1200px; margin: 0 auto; }
        
        h1 { color: #333; font-size: 2.5em; margin-bottom: 10px; }
        .subtitle { color: #666; font-size: 1.1em; }
        
        .league-selector {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            display: none;
        }
        
        .league-selector.show { display: block; }
        
        .league-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }
        
        .league-btn {
            padding: 15px 20px;
            background: white;
            border: 2px solid #c8102e;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 600;
            color: #c8102e;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .league-btn:hover {
            background: #c8102e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(200, 16, 46, 0.3);
        }
        
        .league-btn.active {
            background: #c8102e;
            color: white;
        }
        
        .filters {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }
        
        .filter-btn {
            padding: 12px 24px;
            background: white;
            border: 2px solid #c8102e;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            color: #c8102e;
            cursor: pointer;
            transition: all 0.3s;
            flex: 0 0 calc(50% - 7.5px);
        }

        .filter-btn:hover {
            background: #c8102e;
            color: white;
        }

        .filter-btn.active {
            background: #c8102e;
            color: white;
        }
        
        .matches-container { display: grid; gap: 8px; }
        
        /* Collapsed card - one liner */
        .match-card {
            background: white;
            border-radius: 8px;
            padding: 12px 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: all 0.3s;
            overflow: hidden;
        }

        .match-card:hover {
            background: #f8f8f8;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }

        /* One-liner display */
        .match-oneliner {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1em;
            color: #333;
        }

        .match-oneliner .team-logo {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .match-oneliner .team-name {
            font-weight: 600;
        }

        .match-oneliner .score {
            font-weight: bold;
            color: #c8102e;
            padding: 0 8px;
            font-size: 1.1em;
        }

        .match-oneliner .date {
            color: #999;
            font-size: 0.9em;
            white-space: nowrap;
            margin-left: auto;
        }
        
        .match-oneliner .date-mobile {
            display: none;
        }

        /* Expanded card details - hidden by default */
        .match-details {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #f0f0f0;
        }

        .match-card.expanded .match-details {
            display: block;
        }

        .match-card.expanded {
            cursor: default;
            padding: 20px;
        }

        .match-card.expanded:hover {
            background: white;
        }
        
        .match-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .match-info { display: flex; gap: 15px; align-items: center; font-size: 0.9em; color: #666; }
        
        .matchday {
            background: #e0e0e0;
            color: #333;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
        }
        
        .match-content {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        
        .team { 
            flex: 0 0 auto; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            width: 350px;
        }
        .team.home { justify-content: flex-end; }
        .team.away { justify-content: flex-end; flex-direction: row-reverse; }
        .team-logo { width: 50px; height: 50px; object-fit: contain; }
        .team-name { font-size: 1.2em; font-weight: 600; color: #333; }
        
        .score {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 2em;
            font-weight: bold;
            width: 150px;
            justify-content: center;
        }
        
        .score-separator { color: #ccc; }
        .match-date { text-align: center; color: #999; font-size: 0.9em; margin-top: 10px; }
        .loading { text-align: center; color: #666; font-size: 1.5em; padding: 50px; }
        .error { background: #f44336; color: white; padding: 20px; border-radius: 12px; text-align: center; }
        
        .youtube-btn {
            display: block;
            margin: 15px auto 0 auto;
            padding: 10px 20px;
            background: #c8102e;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.3s;
            text-align: center;
            width: fit-content;
        }
        
        .youtube-btn:hover {
            background: #a00d25;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 315px;
        }

        .video-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #c8102e 0%, #8b0a1f 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 8px;
            color: white;
            font-size: 1.5em;
            font-weight: bold;
            z-index: 10;
        }

        .video-placeholder:hover {
            opacity: 0.9;
        }

        .video-placeholder.hidden {
            display: none;
        }
        
        /* Mobile optimizations */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            h1 {
                font-size: 1.2em;
            }
            
            header {
                padding: 15px;
                margin-bottom: 10px;
            }
            
            .subtitle {
                font-size: 0.8em;
            }
            
            .league-selector {
                padding: 10px;
                margin-bottom: 10px;
            }
            
            .league-selector h2 {
                font-size: 1.1em !important;
                margin-bottom: 10px !important;
            }
            
            .league-buttons {
                grid-template-columns: repeat(2, 1fr);
                gap: 6px;
            }
            
            .league-btn {
                padding: 6px 8px;
                font-size: 0.7em;
            }
            
            .league-btn img {
                width: 20px !important;
                height: 20px !important;
                margin-right: 4px !important;
            }
            
            .filters {
                flex-direction: row;
                padding: 12px;
                gap: 6px;
            }
            
            .filter-btn {
                flex: 0 0 calc(50% - 3px);
                padding: 8px 12px;
                font-size: 0.8em;
            }

            .match-card.collapsed { 
                padding: 10px 8px; 
            }

            .match-oneliner {
                font-size: 0.85em;
                gap: 2px;
                justify-content: flex-start;
            }

            .match-oneliner .team-logo {
                width: 20px;
                height: 20px;
                margin-right: 2px;
            }
            
            .match-oneliner .team-name {
                font-size: 0.95em;
                margin: 0 2px;
            }
            
            .match-oneliner .score {
                font-size: 1em;
                padding: 0 2px;
                white-space: nowrap;
                margin: 0 2px;
            }

            .match-oneliner .date {
                font-size: 0.75em;
                color: #333;
                margin-left: auto;
                white-space: nowrap;
            }
            
            .match-oneliner .date-desktop {
                display: none;
            }
            
            .match-oneliner .date-mobile {
                display: inline;
            }
                    
            .match-content {
                flex-direction: column;
                gap: 10px;
            }
            
            .team {
                width: 100%;
                justify-content: center !important;
            }
            
            .team.away {
                flex-direction: row !important;
            }
            
            .score {
                font-size: 1.5em;
            }
            
            .team-name {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center; color: #c8102e; margin-bottom: 30px; font-size: 3em;">⚽ Soccer Highlights ⚽</h1>
        <div class="league-selector" id="leagueSelector">
            <div id="leagueButtons" class="league-buttons"></div>
        </div>

        <div class="filters" id="filtersContainer" style="display: none;">
            <button class="filter-btn active" id="recentBtn" onclick="setMatchFilter('recent')">Finished</button>
            <button class="filter-btn" id="upcomingBtn" onclick="setMatchFilter('upcoming')">Upcoming</button>
        </div>

        <div class="matches-container" id="matchesContainer"></div>
    </div>

    <script>
        let allLeaguesData = {};
        let highlightsDatabase = {};
        let currentLeague = null;
        let currentLeagueCode = null;
        let currentMatches = [];
        let currentFilter = 'recent';

        // Automatically load data on page load
        window.addEventListener('DOMContentLoaded', function() {
            // Load both league data and highlights database
            Promise.all([
                fetch('output/all_leagues.json').then(r => r.json()),
                fetch('output/highlights_database.json').then(r => r.json())
            ])
            .then(([leaguesData, highlightsData]) => {
                allLeaguesData = leaguesData;
                highlightsDatabase = highlightsData.highlights;
                populateLeagueSelector();
                document.getElementById('leagueSelector').classList.add('show');
            })
            .catch(error => {
                console.log('Auto-load failed:', error);
                document.getElementById('matchesContainer').innerHTML = 
                    '<div class="error">Failed to load league data. Please try again later.</div>';
            });
        });

        // Populate league selector with buttons in custom order
        function populateLeagueSelector() {
            const container = document.getElementById('leagueButtons');
            container.innerHTML = '';
            
            // Define custom order for top leagues
            const customOrder = ['CL', 'PD', 'PL', 'FL1', 'BL1', 'SA'];
            
            // Separate leagues into priority and rest
            const priorityLeagues = [];
            const otherLeagues = [];
            
            Object.keys(allLeaguesData).forEach(code => {
                if (customOrder.includes(code)) {
                    priorityLeagues.push(code);
                } else {
                    otherLeagues.push(code);
                }
            });
            
            // Sort priority leagues by custom order
            priorityLeagues.sort((a, b) => customOrder.indexOf(a) - customOrder.indexOf(b));
            
            // Sort other leagues alphabetically
            otherLeagues.sort((a, b) => {
                const nameA = allLeaguesData[a].name.toUpperCase();
                const nameB = allLeaguesData[b].name.toUpperCase();
                return nameA.localeCompare(nameB);
            });
            
            // Combine: priority first, then others
            const sortedLeagues = [...priorityLeagues, ...otherLeagues];
            
            sortedLeagues.forEach(code => {
                const league = allLeaguesData[code];
                const button = document.createElement('button');
                button.className = 'league-btn';
                const emblem = league.matches?.[0]?.competition?.emblem || '';
                button.innerHTML = `<img src="${emblem}" style="width: 36px; height: 36px; margin-right: 8px; vertical-align: middle;" onerror="this.style.display='none'">${league.name}`;
                button.onclick = () => selectLeague(code, button);
                container.appendChild(button);
            });

            // Auto-select Premier League by default
            const plButton = container.querySelector('button:nth-child(3)'); // PL is 3rd in custom order (CL, PD, PL)
            if (plButton) {
                plButton.click();
            }
        }

        function selectLeague(leagueCode, button) {
            // Remove active class from all buttons
            document.querySelectorAll('.league-btn').forEach(btn => btn.classList.remove('active'));
            // Add active class to clicked button
            button.classList.add('active');
            
            currentLeagueCode = leagueCode;
            currentLeague = allLeaguesData[leagueCode];
            currentMatches = currentLeague.matches;
            
            // Track league selection
            trackEvent('select_league', {
                league_name: currentLeague.name,
                league_code: leagueCode
            });
            
            document.getElementById('filtersContainer').style.display = 'flex';
            
            // Show finished matches by default
            setMatchFilter(currentFilter);
        }

        function setMatchFilter(filter) {
            currentFilter = filter;
            
            // Track filter change
            trackEvent('change_filter', {
                filter: filter,
                league_code: currentLeagueCode
            });
            
            // Update button states
            document.getElementById('recentBtn').classList.toggle('active', filter === 'recent');
            document.getElementById('upcomingBtn').classList.toggle('active', filter === 'upcoming');
            
            // Filter matches
            let filtered = currentMatches;
            
            if (filter === 'upcoming') {
                const now = new Date();
                filtered = filtered
                    .filter(m => m.status === 'SCHEDULED' || m.status === 'TIMED')
                    .filter(m => new Date(m.utcDate) >= now)
                    .sort((a, b) => new Date(a.utcDate) - new Date(b.utcDate));
            } else {
                // Show matches that are finished OR have a video
                filtered = filtered
                    .filter(m => {
                        const matchDate = new Date(m.utcDate).toISOString().split('T')[0];
                        const matchKey = `${m.homeTeam.name}-${m.awayTeam.name}-${matchDate}`;
                        const hasVideo = highlightsDatabase[currentLeagueCode]?.['2025-26']?.[matchKey]?.videoId;
                        return m.status === 'FINISHED' || hasVideo;
                    })
                    .sort((a, b) => new Date(b.utcDate) - new Date(a.utcDate));
            }
            
            displayMatches(filtered);
        }

        function toggleMatchCard(cardElement) {
            cardElement.classList.toggle('expanded');
        }

        function displayMatches(matches) {
            const container = document.getElementById('matchesContainer');
            
            if (matches.length === 0) {
                container.innerHTML = '<div class="loading">No matches found</div>';
                return;
            }

            container.innerHTML = matches.map(match => {
                const homeScore = match.score?.fullTime?.home ?? '-';
                const awayScore = match.score?.fullTime?.away ?? '-';
                
                // Full date for desktop
                const date = new Date(match.utcDate).toLocaleString(undefined, {
                    weekday: 'short',
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                
                // Short date for mobile: "Mon 1/4/26 15:00" (24-hour format)
                const matchDate = new Date(match.utcDate);
                const dayOfWeek = matchDate.toLocaleDateString(undefined, { weekday: 'short' });
                const year = String(matchDate.getFullYear()).slice(-2);
                const hours = String(matchDate.getHours()).padStart(2, '0');
                const minutes = String(matchDate.getMinutes()).padStart(2, '0');
                const shortDate = `${dayOfWeek} ${matchDate.getMonth()+1}/${matchDate.getDate()}/${year} ${hours}:${minutes}`;

                const homeWinner = match.score?.winner === 'HOME_TEAM' ? 'winner' : '';
                const awayWinner = match.score?.winner === 'AWAY_TEAM' ? 'winner' : '';

                // One-liner format: shield-name-score-name-shield
                const oneliner = `
                    <div class="match-oneliner">
                        <img src="${match.homeTeam.crest}" class="team-logo" alt="${match.homeTeam.shortName}" onerror="this.style.display='none'">
                        <span class="team-name">${match.homeTeam.shortName}</span>
                        <span class="score">${homeScore} - ${awayScore}</span>
                        <span class="team-name">${match.awayTeam.shortName}</span>
                        <img src="${match.awayTeam.crest}" class="team-logo" alt="${match.awayTeam.shortName}" onerror="this.style.display='none'">
                        <span class="date date-desktop">${date}</span>
                        <span class="date date-mobile">${shortDate}</span>
                    </div>
                `;

                let youtubeLink = '';

                // Only show video/search button if match has already started
                const matchTime = new Date(match.utcDate);
                const now = new Date();
                const hasStarted = matchTime <= now;

                if (hasStarted) {
                    const matchDate = new Date(match.utcDate).toISOString().split('T')[0];
                    const matchKey = `${match.homeTeam.name}-${match.awayTeam.name}-${matchDate}`;
                    const season = '2025-26';
                    const videoId = highlightsDatabase[currentLeagueCode]?.[season]?.[matchKey]?.videoId;
                    
                    if (videoId) {
                        // Embed the video directly
                        youtubeLink = `
                            <iframe width="100%" height="315" 
                                 src="https://www.youtube.com/embed/${videoId}?mute=1"
                                 frameborder="0" 
                                 allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                                 referrerpolicy="strict-origin-when-cross-origin"
                                 allowfullscreen
                                 loading="lazy"
                                 style="border-radius: 8px; margin-top: 15px;">
                               </iframe>`;
                    } else {
                        // Fallback to search button with tracking
                        const youtubeSearchQuery = `${match.homeTeam.name} vs ${match.awayTeam.name} highlights`;
                        youtubeLink = `<a href="https://www.youtube.com/results?search_query=${encodeURIComponent(youtubeSearchQuery)}" 
                                         target="_blank" 
                                         class="youtube-btn"
                                         onclick="trackEvent('search_youtube', {league: '${currentLeagueCode}', home: '${match.homeTeam.shortName}', away: '${match.awayTeam.shortName}'})">📺 Watch on Youtube</a>`;
                    }
                }

                // Full expanded details
                const details = `
                    <div class="match-details">
                        ${youtubeLink}
                    </div>
                `;

                return `
                    <div class="match-card" onclick="toggleMatchCard(this)">
                        ${oneliner}
                        ${details}
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
