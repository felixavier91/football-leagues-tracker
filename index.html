    <title>Soccer Highlights</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            background-attachment: fixed;
            padding: 20px;
            min-height: 100vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        .container { max-width: 1200px; margin: 0 auto; }
        
        h1 { color: #333; font-size: 2.5em; margin-bottom: 10px; }
        .subtitle { color: #666; font-size: 1.1em; }
        
        .league-selector {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            display: none;
        }
        
        .league-selector.show { display: block; }
        
        .league-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }
        
        .league-btn {
            padding: 15px 20px;
            background: white;
            border: 2px solid #c8102e;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 600;
            color: #c8102e;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .league-btn:hover {
            background: #c8102e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(200, 16, 46, 0.3);
        }
        
        .league-btn.active {
            background: #c8102e;
            color: white;
        }
        
        .filters {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }
        
        .filter-btn {
            padding: 12px 24px;
            background: white;
            border: 2px solid #c8102e;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            color: #c8102e;
            cursor: pointer;
            transition: all 0.3s;
            flex: 0 0 calc(50% - 7.5px);
        }

        .filter-btn:hover {
            background: #c8102e;
            color: white;
        }

        .filter-btn.active {
            background: #c8102e;
            color: white;
        }
        
        .matches-container { display: grid; gap: 8px; }
        
        /* Collapsed card - one liner */
        .match-card {
            background: white;
            border-radius: 8px;
            padding: 12px 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: all 0.3s;
            overflow: hidden;
        }

        .match-card:hover {
            background: #f8f8f8;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }

        /* One-liner display */
        .match-oneliner {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1em;
            color: #333;
        }

        .match-oneliner .team-logo {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .match-oneliner .team-name {
            font-weight: 600;
        }

        .match-oneliner .score {
            font-weight: bold;
            color: #c8102e;
            padding: 0 8px;
            font-size: 1.1em;
        }

        .match-oneliner .date {
            color: #999;
            font-size: 0.9em;
            white-space: nowrap;
            margin-left: auto;
        }
        
        .match-oneliner .date-mobile {
            display: none;
        }

        /* Expanded card details - hidden by default */
        .match-details {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #f0f0f0;
        }

        .match-card.expanded .match-details {

        }

        .match-card.expanded {
            cursor: default;
            padding: 20px;
        }

        .match-card.expanded:hover {
            background: white;
        }
        
        .match-header {

            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;

        .matchday {
            background: #e0e0e0;
            color: #333;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
        }
        
        .match-content {
            display: flex;
            justify-content: center;
            align-items: center;

        }
        
        .team {

            display: flex; 
            align-items: center;

        }
        .team.home { justify-content: flex-end; }

        .team-name { font-size: 1.2em; font-weight: 600; color: #333; }

            align-items: center;
            gap: 10px;
            font-size: 2em;
            font-weight: bold;

        .error { background: #f44336; color: white; padding: 20px; border-radius: 12px; text-align: center; }

        /* Soccer Pitch Formation */
        .pitch-container {
            margin: 20px 0;

        .pitch-header {
            display: flex;

        .soccer-pitch {
            background: linear-gradient(180deg, #2d5016 0%, #3a6b1e 50%, #2d5016 100%);

<body>
    <div class="container">
        <h1 style="text-align: center; color: #c8102e; margin-bottom: 30px; font-size: 3em;">⚽ Soccer Highlights ⚽</h1>
        <div class="league-selector" id="leagueSelector">
            <div id="leagueButtons" class="league-buttons"></div>
        </div>

        <div class="filters" id="filtersContainer" style="display: none;">
            <button class="filter-btn active" id="recentBtn" onclick="setMatchFilter('recent')">Finished</button>
            <button class="filter-btn" id="upcomingBtn" onclick="setMatchFilter('upcoming')">Upcoming</button>
        </div>

        <div class="matches-container" id="matchesContainer"></div>
    </div>

    <script>
        let allLeaguesData = {};
        let highlightsDatabase = {};
        let currentLeague = null;
        let currentLeagueCode = null;
        let currentMatches = [];
        let currentFilter = 'recent';

        // Automatically load data on page load
        window.addEventListener('DOMContentLoaded', function() {
            // Load both league data and highlights database
            Promise.all([
                fetch('output/all_leagues.json').then(r => r.json()),
                fetch('output/highlights_database.json').then(r => r.json())
            ])
            .then(([leaguesData, highlightsData]) => {
                allLeaguesData = leaguesData;
                highlightsDatabase = highlightsData.highlights;
                populateLeagueSelector();
                document.getElementById('leagueSelector').classList.add('show');
            })
            .catch(error => {
                console.log('Auto-load failed:', error);
                document.getElementById('matchesContainer').innerHTML = 
                    '<div class="error">Failed to load league data. Please try again later.</div>';
            });
        });

        // Populate league selector with buttons in custom order
        function populateLeagueSelector() {
            const container = document.getElementById('leagueButtons');
            container.innerHTML = '';
            
            // Define custom order for top leagues
            const customOrder = ['CL', 'PD', 'PL', 'FL1', 'BL1', 'SA'];
            
            // Separate leagues into priority and rest
            const priorityLeagues = [];
            const otherLeagues = [];
            
            Object.keys(allLeaguesData).forEach(code => {
                if (customOrder.includes(code)) {
                    priorityLeagues.push(code);
                } else {
                    otherLeagues.push(code);
                }
            });
            
            // Sort priority leagues by custom order
            priorityLeagues.sort((a, b) => customOrder.indexOf(a) - customOrder.indexOf(b));
            
            // Sort other leagues alphabetically
            otherLeagues.sort((a, b) => {
                const nameA = allLeaguesData[a].name.toUpperCase();
                const nameB = allLeaguesData[b].name.toUpperCase();
                return nameA.localeCompare(nameB);
            });
            
            // Combine: priority first, then others
            const sortedLeagues = [...priorityLeagues, ...otherLeagues];
            
            sortedLeagues.forEach(code => {
                const league = allLeaguesData[code];
                const button = document.createElement('button');
                button.className = 'league-btn';
                const emblem = league.matches?.[0]?.competition?.emblem || '';
                button.innerHTML = `<img src="${emblem}" style="width: 36px; height: 36px; margin-right: 8px; vertical-align: middle;" onerror="this.style.display='none'">${league.name}`;
                button.onclick = () => selectLeague(code, button);
                container.appendChild(button);
            });

            // Auto-select Premier League by default
            const plButton = container.querySelector('button:nth-child(3)'); // PL is 3rd in custom order (CL, PD, PL)
            if (plButton) {
                plButton.click();
            }
        }

        function selectLeague(leagueCode, button) {
            // Remove active class from all buttons
            document.querySelectorAll('.league-btn').forEach(btn => btn.classList.remove('active'));
            // Add active class to clicked button
            button.classList.add('active');
            
            currentLeagueCode = leagueCode;
            currentLeague = allLeaguesData[leagueCode];
            currentMatches = currentLeague.matches;
            
            // Track league selection
            trackEvent('select_league', {
                league_name: currentLeague.name,
                league_code: leagueCode
            });
            
            document.getElementById('filtersContainer').style.display = 'flex';
            
            // Show finished matches by default
            setMatchFilter(currentFilter);
        }

        function setMatchFilter(filter) {
            currentFilter = filter;
            
            // Track filter change
            trackEvent('change_filter', {
                filter: filter,
                league_code: currentLeagueCode
            });
            
            // Update button states
            document.getElementById('recentBtn').classList.toggle('active', filter === 'recent');
            document.getElementById('upcomingBtn').classList.toggle('active', filter === 'upcoming');
            
            // Filter matches
            let filtered = currentMatches;
            
            if (filter === 'upcoming') {
                const now = new Date();
                filtered = filtered
                    .filter(m => m.status === 'SCHEDULED' || m.status === 'TIMED')
                    .filter(m => new Date(m.utcDate) >= now)
                    .sort((a, b) => new Date(a.utcDate) - new Date(b.utcDate));
            } else {
                // Show matches that are finished OR have a video
                filtered = filtered
                    .filter(m => {
                        const matchDate = new Date(m.utcDate).toISOString().split('T')[0];
                        const matchKey = `${m.homeTeam.name}-${m.awayTeam.name}-${matchDate}`;
                        const hasVideo = highlightsDatabase[currentLeagueCode]?.['2025-26']?.[matchKey]?.videoId;
                        return m.status === 'FINISHED' || hasVideo;
                    })
                    .sort((a, b) => new Date(b.utcDate) - new Date(a.utcDate));
            }
            
            displayMatches(filtered);
        }

        function toggleMatchCard(cardElement) {
            cardElement.classList.toggle('expanded');
        }

        function displayMatches(matches) {
            const container = document.getElementById('matchesContainer');
            
            if (matches.length === 0) {
                container.innerHTML = '<div class="loading">No matches found</div>';
                return;
            }

            container.innerHTML = matches.map(match => {
                const homeScore = match.score?.fullTime?.home ?? '-';
                const awayScore = match.score?.fullTime?.away ?? '-';
                
                // Full date for desktop
                const date = new Date(match.utcDate).toLocaleString(undefined, {
                    weekday: 'short',
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                
                // Short date for mobile: "Mon 1/4/26 15:00" (24-hour format)
                const matchDate = new Date(match.utcDate);
                const dayOfWeek = matchDate.toLocaleDateString(undefined, { weekday: 'short' });
                const year = String(matchDate.getFullYear()).slice(-2);
                const hours = String(matchDate.getHours()).padStart(2, '0');
                const minutes = String(matchDate.getMinutes()).padStart(2, '0');
                const shortDate = `${dayOfWeek} ${matchDate.getMonth()+1}/${matchDate.getDate()}/${year} ${hours}:${minutes}`;

                const homeWinner = match.score?.winner === 'HOME_TEAM' ? 'winner' : '';
                const awayWinner = match.score?.winner === 'AWAY_TEAM' ? 'winner' : '';

                // One-liner format: shield-name-score-name-shield
                const oneliner = `
                    <div class="match-oneliner">
                        <img src="${match.homeTeam.crest}" class="team-logo" alt="${match.homeTeam.shortName}" onerror="this.style.display='none'">
                        <span class="team-name">${match.homeTeam.shortName}</span>
                        <span class="score">${homeScore} - ${awayScore}</span>
                        <span class="team-name">${match.awayTeam.shortName}</span>
                        <img src="${match.awayTeam.crest}" class="team-logo" alt="${match.awayTeam.shortName}" onerror="this.style.display='none'">
                        <span class="date date-desktop">${date}</span>
                        <span class="date date-mobile">${shortDate}</span>
                    </div>
                `;

                let youtubeLink = '';

                // Only show video/search button if match has already started
                const matchTime = new Date(match.utcDate);
                const now = new Date();
                const hasStarted = matchTime <= now;

                if (hasStarted) {
                    const matchDate = new Date(match.utcDate).toISOString().split('T')[0];
                    const matchKey = `${match.homeTeam.name}-${match.awayTeam.name}-${matchDate}`;
                    const season = '2025-26';
                    const videoId = highlightsDatabase[currentLeagueCode]?.[season]?.[matchKey]?.videoId;
                    
                    if (videoId) {
                        // Embed the video directly
                        youtubeLink = `
                            <iframe width="100%" height="315" 
                                 src="https://www.youtube.com/embed/${videoId}?mute=1"
                                 frameborder="0" 
                                 allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                                 referrerpolicy="strict-origin-when-cross-origin"
                                 allowfullscreen
                                 loading="lazy"
                                 style="border-radius: 8px; margin-top: 15px;">
                               </iframe>`;
                    } else {
                        // Fallback to search button with tracking
                        const youtubeSearchQuery = `${match.homeTeam.name} vs ${match.awayTeam.name} highlights`;
                        youtubeLink = `<a href="https://www.youtube.com/results?search_query=${encodeURIComponent(youtubeSearchQuery)}" 
                                         target="_blank" 
                                         class="youtube-btn"
                                         onclick="trackEvent('search_youtube', {league: '${currentLeagueCode}', home: '${match.homeTeam.shortName}', away: '${match.awayTeam.shortName}'})">📺 Watch on Youtube</a>`;
                    }
                }

                // Enhanced match details
                let matchInfo = '';
                
                // Venue and Attendance
                if (match.venue || match.attendance) {
                    const venueText = match.venue ? `📍 ${match.venue}` : '';
                    const attendanceText = match.attendance ? `👥 ${match.attendance.toLocaleString()}` : '';
                    const separator = venueText && attendanceText ? ' • ' : '';
                    matchInfo = `<div class="match-info-line">${venueText}${separator}${attendanceText}</div>`;
                }
                
                // Referee
                let refereeSection = '';
                if (match.referees && match.referees.length > 0) {
                    const mainRef = match.referees.find(r => r.type === 'REFEREE');
                    if (mainRef) {
                        refereeSection = `<div class="referee-section">👨‍⚖️ Referee: ${mainRef.name}</div>`;
                    }
                }
                
                // Timeline: Interweave goals and cards chronologically
                let timeline = '';
                const events = [];
                
                // Add goals to events
                if (match.goals && match.goals.length > 0) {
                    match.goals.forEach(goal => {
                        const minute = goal.injuryTime ? goal.minute + (goal.injuryTime / 100) : goal.minute;
                        events.push({
                            minute: minute,
                            displayMinute: goal.injuryTime ? `${goal.minute}+${goal.injuryTime}'` : `${goal.minute}'`,
                            type: 'goal',
                            data: goal
                        });
                    });
                }
                
                // Add bookings to events
                if (match.bookings && match.bookings.length > 0) {
                    match.bookings.forEach(booking => {
                        const minute = booking.injuryTime ? booking.minute + (booking.injuryTime / 100) : booking.minute;
                        events.push({
                            minute: minute,
                            displayMinute: booking.injuryTime ? `${booking.minute}+${booking.injuryTime}'` : `${booking.minute}'`,
                            type: 'card',
                            data: booking
                        });
                    });
                }
                
                // Sort events by minute
                events.sort((a, b) => a.minute - b.minute);
                
                // Generate timeline HTML (left-right pattern: home on left, away on right)
                if (events.length > 0) {
                    const timelineHTML = events.map(event => {
                        if (event.type === 'goal') {
                            const goal = event.data;
                            const scorer = goal.scorer?.name || 'Unknown';
                            const assist = goal.assist?.name ? ` (Assist: ${goal.assist.name})` : '';
                            const score = `${goal.score?.home}-${goal.score?.away}`;
                            const isPenalty = goal.type === 'PENALTY' ? ' (Penalty)' : '';
                            const isOwnGoal = goal.type === 'OWN_GOAL' ? ' (Own Goal)' : '';
                            const isHome = goal.team?.id === match.homeTeam.id;
                            
                            if (isHome) {
                                // Home team goal - align left
                                return `<div class="timeline-item home-left">
                                    <span class="timeline-icon">⚽</span>
                                    <span class="timeline-text"><strong>${scorer}</strong>${assist}${isPenalty}${isOwnGoal} <span class="timeline-score">${score}</span></span>
                                    <span class="timeline-minute">${event.displayMinute}</span>
                                </div>`;
                            } else {
                                // Away team goal - align right
                                return `<div class="timeline-item away-right">
                                    <span class="timeline-minute">${event.displayMinute}</span>
                                    <span class="timeline-text"><strong>${scorer}</strong>${assist}${isPenalty}${isOwnGoal} <span class="timeline-score">${score}</span></span>
                                    <span class="timeline-icon">⚽</span>
                                </div>`;
                            }
                        } else {
                            const booking = event.data;
                            const player = booking.player?.name || 'Unknown';
                            const card = booking.card === 'YELLOW' ? '🟨' : '🟥';
                            const isHome = booking.team?.id === match.homeTeam.id;
                            
                            if (isHome) {
                                // Home team card - align left
                                return `<div class="timeline-item home-left">
                                    <span class="timeline-icon">${card}</span>
                                    <span class="timeline-text">${player}</span>
                                    <span class="timeline-minute">${event.displayMinute}</span>
                                </div>`;
                            } else {
                                // Away team card - align right
                                return `<div class="timeline-item away-right">
                                    <span class="timeline-minute">${event.displayMinute}</span>
                                    <span class="timeline-text">${player}</span>
                                    <span class="timeline-icon">${card}</span>
                                </div>`;
                            }
                        }
                    }).join('');
                    timeline = `<div class="match-timeline">${timelineHTML}</div>`;
                }
                
                // Soccer Pitch Formation Visualization
                let pitchSection = '';
                if (match.homeTeam?.lineup && match.awayTeam?.lineup) {
                    const homeFormation = match.homeTeam?.formation || '';
                    const awayFormation = match.awayTeam?.formation || '';
                    
                    // Function to categorize player position
                    const getPositionCategory = (position) => {
                        const pos = position.toLowerCase();
                        if (pos.includes('goalkeeper')) return 'GK';
                        if (pos.includes('back') || pos.includes('defence')) return 'DEF';
                        if (pos.includes('midfield')) return 'MID';
                        if (pos.includes('forward') || pos.includes('winger') || pos.includes('striker')) return 'FWD';
                        return 'MID'; // default
                    };
                    
                    // Group home players by position
                    const homePlayers = {
                        GK: [],
                        DEF: [],
                        MID: [],
                        FWD: []
                    };
                    
                    match.homeTeam.lineup.forEach(player => {
                        const category = getPositionCategory(player.position);
                        homePlayers[category].push(player);
                    });
                    
                    // Group away players by position
                    const awayPlayers = {
                        GK: [],
                        DEF: [],
                        MID: [],
                        FWD: []
                    };
                    
                    match.awayTeam.lineup.forEach(player => {
                        const category = getPositionCategory(player.position);
                        awayPlayers[category].push(player);
                    });
                    
                    // Generate player HTML
                    const generatePlayerHTML = (players, teamClass) => {
                        return players.map(p => 
                            `<div class="pitch-player ${teamClass}" title="${p.position}">
                                <div class="player-number">${p.shirtNumber}</div>
                                <div class="player-name-short">${p.name.split(' ').pop()}</div>
                            </div>`
                        ).join('');
                    };
                    
                    pitchSection = `
                        <div class="pitch-container">
                            <div class="pitch-header">
                                <span class="pitch-team home-team">${match.homeTeam.shortName} (${homeFormation})</span>
                                <span class="pitch-vs">vs</span>
                                <span class="pitch-team away-team">${match.awayTeam.shortName} (${awayFormation})</span>
                            </div>
                            <div class="soccer-pitch">
                                <!-- Away Team (top) -->
                                <div class="pitch-row away-forwards">
                                    ${generatePlayerHTML(awayPlayers.FWD, 'away-player')}
                                </div>
                                <div class="pitch-row away-midfield">
                                    ${generatePlayerHTML(awayPlayers.MID, 'away-player')}
                                </div>
                                <div class="pitch-row away-defense">
                                    ${generatePlayerHTML(awayPlayers.DEF, 'away-player')}
                                </div>
                                <div class="pitch-row away-gk">
                                    ${generatePlayerHTML(awayPlayers.GK, 'away-player')}
                                </div>
                                
                                <!-- Midfield line -->
                                <div class="midfield-line"></div>
                                
                                <!-- Home Team (bottom) -->
                                <div class="pitch-row home-gk">
                                    ${generatePlayerHTML(homePlayers.GK, 'home-player')}
                                </div>
                                <div class="pitch-row home-defense">
                                    ${generatePlayerHTML(homePlayers.DEF, 'home-player')}
                                </div>
                                <div class="pitch-row home-midfield">
                                    ${generatePlayerHTML(homePlayers.MID, 'home-player')}
                                </div>
                                <div class="pitch-row home-forwards">
                                    ${generatePlayerHTML(homePlayers.FWD, 'home-player')}
                                </div>
                            </div>
                        </div>
                    `;
                }

                // Full expanded details (venue/referee at top, timeline in middle, pitch, then video at bottom)
                const details = `
                    <div class="match-details">
                        ${matchInfo}
                        ${refereeSection}
                        ${timeline}
                        ${pitchSection}
                        ${youtubeLink}
                    </div>
                `;

                return `
                    <div class="match-card" onclick="toggleMatchCard(this)">
                        ${oneliner}
                        ${details}
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
